schema_version = "1"
protect_main = true
protected_branches = ["main"]
protected_tags = ["v*"]
hooks = "enforce"
direct_push_to_main = "deny"
merge_request_required = true
linear_history_required = true
branch_must_be_rebased_on_base = true

[main_relay]
enabled = true
actor = "jeryu"
protected_branch = "main"
require_admission_receipt = true

[offline_release_mirror]
enabled = false
remote = ""
refs = ["refs/tags/v*", "refs/heads/release/*"]
