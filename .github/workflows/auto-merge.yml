name: Auto-merge

# Thin CI lane. The source of truth lives at ops/ci/auto-merge-lane.sh so
# local rehearsals and CI execute identical commands (jankurai HLT-042).
#
# Behavior:
#   - Triggered on PR open / sync / reopen / ready_for_review.
#   - Also re-evaluates on every workflow_run completion of the Rust + Jankurai pipelines.
#   - Calls ops/ci/auto-merge-lane.sh classify to decide skip vs enable.
#   - On 'enable', issues the GraphQL enablePullRequestAutoMerge(SQUASH) mutation.
#   - Skips draft PRs and PRs with the 'no-auto-merge' label.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["Rust", "Jankurai"]
    types: [completed]

concurrency:
  group: auto-merge-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge if green
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Find the target PR
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            let pr;
            if (context.eventName === 'pull_request') {
              pr = context.payload.pull_request;
            } else {
              const sha = context.payload.workflow_run.head_sha;
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${context.payload.workflow_run.head_repository.owner.login}:${context.payload.workflow_run.head_branch}`,
              });
              pr = prs.find(p => p.head.sha === sha);
            }
            if (!pr) { core.setOutput('found', 'false'); return; }
            fs.writeFileSync('/tmp/pr.json', JSON.stringify(pr));
            core.setOutput('found', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('node_id', pr.node_id);

      - name: Classify PR
        id: classify
        if: steps.pr.outputs.found == 'true'
        run: |
          out="$(bash ops/ci/auto-merge-lane.sh classify /tmp/pr.json)"
          echo "$out"
          decision="$(echo "$out" | awk -F'\t' '{print $1}')"
          reason="$(echo "$out" | awk -F'\t' '{print $2}')"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (squash)
        if: steps.classify.outputs.decision == 'enable'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const mutation = `
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { autoMergeRequest { enabledAt } }
                }
              }
            `;
            try {
              const result = await github.graphql(mutation, {
                pullRequestId: '${{ steps.pr.outputs.node_id }}',
              });
              core.info(`Auto-merge enabled for PR #${{ steps.pr.outputs.number }}: ${JSON.stringify(result)}`);
            } catch (err) {
              core.warning(`Could not enable auto-merge: ${err.message}`);
              core.warning(`This is expected if 'Allow auto-merge' is disabled in repo settings,`);
              core.warning(`or if the PR has unresolved conversations or required reviews pending.`);
            }
