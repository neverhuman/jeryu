name: Jeryu

on:
  pull_request:
  push:
    branches: [main, 'codex/public-monorepo-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeryu-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source, public, rust, web, runtime, product, security, sandbox, oci, splits, legacy, auxiliary, audit, auditor]
    env:
      CARGO_BUILD_JOBS: '2'
      CI: 'true'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run shared local command
        env:
          JERYU_CI_LANE: ${{ matrix.lane }}
        run: |
          if [ "$JERYU_CI_LANE" = sandbox ] || [ "$JERYU_CI_LANE" = oci ]; then
            sudo -n env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
              CARGO_BUILD_JOBS=2 JERYU_DISPOSABLE_SANDBOX=1 bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          else
            bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          fi

  required:
    name: jeryu/required
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Read this workflow attempt
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          out=$(mktemp -d "$RUNNER_TEMP/jeryu-required.XXXXXXXX")
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh api "$api" > "$out/run.json"
          gh api --paginate "$api/jobs?per_page=100" > "$out/jobs.json"
          printf 'directory=%s\n' "$out" >> "$GITHUB_OUTPUT"
      - name: Require every proof job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
          JERYU_CI_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          JERYU_CI_INVENTORY: ${{ steps.inventory.outputs.directory }}
        run: bash scripts/check-required-ci.sh "$JERYU_CI_INVENTORY/run.json" "$JERYU_CI_INVENTORY/jobs.json"
