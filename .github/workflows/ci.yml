name: Jeryu

on:
  pull_request:
  push:
    branches: [main, 'codex/public-monorepo-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeryu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source, public, rust, web, runtime, product, security, sandbox, oci, splits, legacy, auxiliary, audit, auditor]
    env:
      CARGO_BUILD_JOBS: '2'
      CI: 'true'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Run shared local command
        env:
          JERYU_CI_LANE: ${{ matrix.lane }}
        run: |
          if [ "$JERYU_CI_LANE" = sandbox ] || [ "$JERYU_CI_LANE" = oci ]; then
            sudo -n env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
              CARGO_BUILD_JOBS=2 JERYU_DISPOSABLE_SANDBOX=1 bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          else
            bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          fi

  required:
    name: jeryu/required
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every proof job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
        run: test "$RESULT" = success
