name: Jeryu

on:
  pull_request:
  push:
    branches: [main, 'codex/public-monorepo-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeryu-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source, public, rust, web, runtime, product, security, sandbox, oci, splits, legacy, auxiliary, audit, auditor]
    env:
      CARGO_BUILD_JOBS: '2'
      CI: 'true'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26.1.0'
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap acl
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Prepare dedicated process test identity
        if: ${{ matrix.lane == 'runtime' || matrix.lane == 'rust' }}
        env:
          JERYU_CI_LANE: ${{ matrix.lane }}
        run: |
          sudo -n useradd --uid 45165 --user-group --no-create-home --home-dir /home/jeryu-runtime --shell /bin/bash jeryu-runtime
          sudo -n mkdir --mode=0700 /home/jeryu-runtime
          # Hosted parent directories can carry default ACLs, which override
          # umask for new descendants such as the private auditor installation.
          sudo -n setfacl --remove-all --remove-default /home/jeryu-runtime
          sudo -n chmod 0700 /home/jeryu-runtime
          sudo -n mv "$HOME/.cargo" "$HOME/.rustup" /home/jeryu-runtime/
          sudo -n chown -R jeryu-runtime:jeryu-runtime "$GITHUB_WORKSPACE" /home/jeryu-runtime
          # The checkout is owned by the test account, but its runner-owned
          # ancestors still need traversal for absolute-path child commands.
          parent=$(dirname "$GITHUB_WORKSPACE")
          while [ "$parent" != / ]; do
            sudo -n setfacl -m u:45165:--x "$parent"
            parent=$(dirname "$parent")
          done
          if [ "$JERYU_CI_LANE" = rust ]; then
            sudo -n usermod --append --groups docker jeryu-runtime
          fi
      - name: Run shared local command
        env:
          JERYU_CI_LANE: ${{ matrix.lane }}
        run: |
          if [ "$JERYU_CI_LANE" = sandbox ] || [ "$JERYU_CI_LANE" = oci ]; then
            sudo -n env PATH="$PATH" CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" \
              CARGO_BUILD_JOBS=2 JERYU_DISPOSABLE_SANDBOX=1 bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          elif [ "$JERYU_CI_LANE" = runtime ] || [ "$JERYU_CI_LANE" = rust ]; then
            # Process-custody checks require visibility of every process with
            # the fixture UID. The hosted runner's own UID includes private
            # supervisor processes; keep their identity outside this proof.
            sudo -n -u jeryu-runtime env -i HOME=/home/jeryu-runtime \
              PATH="/home/jeryu-runtime/.cargo/bin:$PATH" \
              CARGO_HOME=/home/jeryu-runtime/.cargo RUSTUP_HOME=/home/jeryu-runtime/.rustup \
              CARGO_BUILD_JOBS=2 CI=true bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          else
            bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          fi
      - name: Preserve split check diagnostics
        if: ${{ always() && matrix.lane == 'splits' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: split-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/split-evidence/**/*.log
            target/split-evidence/**/*.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: jeryu/required
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Read this workflow attempt
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          out=$(mktemp -d "$RUNNER_TEMP/jeryu-required.XXXXXXXX")
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh api "$api" > "$out/run.json"
          gh api --paginate "$api/jobs?per_page=100" > "$out/jobs.json"
          printf 'directory=%s\n' "$out" >> "$GITHUB_OUTPUT"
      - name: Require every proof job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
          JERYU_CI_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          JERYU_CI_INVENTORY: ${{ steps.inventory.outputs.directory }}
        run: bash scripts/check-required-ci.sh "$JERYU_CI_INVENTORY/run.json" "$JERYU_CI_INVENTORY/jobs.json"
