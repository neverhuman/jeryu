name: Jeryu

on:
  pull_request:
  push:
    branches: [main, 'codex/public-monorepo-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jeryu-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        lane: [source, public, rust, web, runtime, product, security]
    env:
      CARGO_BUILD_JOBS: '2'
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26.1.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap acl apparmor
      - name: Admit unprivileged audit sandbox
        if: ${{ matrix.lane == 'rust' }}
        run: bash scripts/check-audit-sandbox.sh --prepare-disposable-ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: ${{ matrix.lane != 'rust' && matrix.lane != 'runtime' }}
        with:
          shared-key: jeryu-required
      - name: Prepare dedicated process test identity
        if: ${{ matrix.lane == 'runtime' || matrix.lane == 'rust' }}
        env:
          JERYU_CI_LANE: ${{ matrix.lane }}
        run: |
          sudo -n useradd --uid 45165 --user-group --no-create-home --home-dir /home/jeryu-runtime --shell /bin/bash jeryu-runtime
          sudo -n mkdir --mode=0700 /home/jeryu-runtime
          # Hosted parent directories can carry default ACLs, which override
          # umask for new descendants such as the private auditor installation.
          sudo -n setfacl --remove-all --remove-default /home/jeryu-runtime
          sudo -n chmod 0700 /home/jeryu-runtime
          sudo -n mkdir --mode=0700 /home/jeryu-runtime/tmp
          sudo -n mv "$HOME/.cargo" "$HOME/.rustup" /home/jeryu-runtime/
          sudo -n chown -R jeryu-runtime:jeryu-runtime "$GITHUB_WORKSPACE" /home/jeryu-runtime
          if [ "$JERYU_CI_LANE" = rust ]; then
            sudo -n usermod --append --groups docker jeryu-runtime
          fi
      - name: Run shared local command
        env:
          JERYU_CI_LANE: ${{ matrix.lane }}
          JERYU_AUDIT_OUTPUT_ROOT: ${{ runner.temp }}/jeryu-audit-census
        run: |
          if [ "$JERYU_CI_LANE" = runtime ] || [ "$JERYU_CI_LANE" = rust ]; then
            # Process-custody checks require visibility of every process with
            # the fixture UID. The hosted runner's own UID includes private
            # supervisor processes; keep their identity outside this proof.
            # Auditor custody also checks every source ancestor's owner.
            # Move this checkout beneath the private identity for the command,
            # then restore it for the runner's normal post-job cleanup.
            isolated_source=/home/jeryu-runtime/source
            test -d "$GITHUB_WORKSPACE/.git" && test ! -L "$GITHUB_WORKSPACE/.git"
            checkout_identity=$(sudo -n stat -c '%d:%i' "$GITHUB_WORKSPACE")
            sudo -n test ! -e "$isolated_source"
            sudo -n test ! -L "$isolated_source"
            restore_source() {
              result=$?
              trap - EXIT
              if ! sudo -n mv --no-copy --no-clobber --no-target-directory "$isolated_source" "$GITHUB_WORKSPACE" ||
                sudo -n test -e "$isolated_source" ||
                test "$(sudo -n stat -c '%d:%i' "$GITHUB_WORKSPACE")" != "$checkout_identity"; then
                echo 'isolated checkout restoration failed; retain source at its private path' >&2
                exit 1
              fi
              exit "$result"
            }
            sudo -n mv --no-copy --no-clobber --no-target-directory "$GITHUB_WORKSPACE" "$isolated_source"
            test "$(sudo -n stat -c '%d:%i' "$isolated_source")" = "$checkout_identity"
            trap restore_source EXIT
            sudo -n -u jeryu-runtime env -i HOME=/home/jeryu-runtime \
              TMPDIR=/home/jeryu-runtime/tmp \
              PATH="/home/jeryu-runtime/.cargo/bin:$PATH" \
              CARGO_HOME=/home/jeryu-runtime/.cargo RUSTUP_HOME=/home/jeryu-runtime/.rustup \
              CARGO_BUILD_JOBS=2 CI=true bash "$isolated_source/ops/ci/monorepo.sh" "$JERYU_CI_LANE"
          else
            bash ops/ci/monorepo.sh "$JERYU_CI_LANE"
          fi
      - name: Prepare generated contract diagnostics
        if: ${{ failure() && matrix.lane == 'web' }}
        timeout-minutes: 10
        env:
          JERYU_CI_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$JERYU_CI_SOURCE"
          test -z "$(GIT_OPTIONAL_LOCKS=0 git status --porcelain)"
          source_tree=$(git rev-parse 'HEAD^{tree}')
          # The earlier required command remains failed. This owning generation
          # supplies reviewable source artifacts; it does not waive contract drift.
          bash scripts/contracts.sh --write
          test "$(git rev-parse HEAD)" = "$JERYU_CI_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$source_tree"
          git diff --exit-code -- . \
            ':!components/jeryu-core/contracts/generated' \
            ':!components/jeryu-jira/contracts/generated' \
            ':!components/jeryu-web/contracts/generated'
          mkdir -p target
          sha256sum components/jeryu-core/contracts/generated/*.ts \
            components/jeryu-jira/contracts/generated/*.ts \
            components/jeryu-web/contracts/generated/*.ts > target/contract-checksums.sha256
          jq -n --arg source "$JERYU_CI_SOURCE" --arg tree "$source_tree" \
            --arg repository "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg workflow "$GITHUB_WORKFLOW_REF" \
            --arg compiler "$(rustc --version)" \
            --arg core "$(sha256sum target/debug/export_contracts | cut -d ' ' -f1)" \
            --arg work "$(sha256sum target/debug/jeryu-jira-export-contracts | cut -d ' ' -f1)" \
            --arg checksums "$(sha256sum target/contract-checksums.sha256 | cut -d ' ' -f1)" \
            '{schema_version:"jeryu.contract-diagnostics/v1",source_commit:$source,source_tree:$tree,
              repository:$repository,run_id:$run,run_attempt:$attempt,workflow_ref:$workflow,
              rustc:$compiler,core_generator_sha256:$core,work_generator_sha256:$work,
              checksums_sha256:$checksums,command:"bash scripts/contracts.sh --write",
              generation_exit:0,source_qualified:false,publication_qualified:false}' \
            > target/contract-diagnostics.json
      - name: Preserve generated contract diagnostics
        if: ${{ failure() && matrix.lane == 'web' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: generated-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/contract-diagnostics.json
            target/contract-checksums.sha256
            components/jeryu-core/contracts/generated/*.ts
            components/jeryu-jira/contracts/generated/*.ts
            components/jeryu-web/contracts/generated/*.ts
          if-no-files-found: error
          retention-days: 30

  required:
    name: jeryu/required
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Read this workflow attempt
        id: inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          out=$(mktemp -d "$RUNNER_TEMP/jeryu-required.XXXXXXXX")
          api="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          gh api "$api" > "$out/run.json"
          gh api --paginate "$api/jobs?per_page=100" > "$out/jobs.json"
          printf 'directory=%s\n' "$out" >> "$GITHUB_OUTPUT"
      - name: Require every proof job to succeed
        env:
          RESULT: ${{ needs.verify.result }}
          JERYU_CI_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
          JERYU_CI_INVENTORY: ${{ steps.inventory.outputs.directory }}
        run: bash scripts/check-required-ci.sh "$JERYU_CI_INVENTORY/run.json" "$JERYU_CI_INVENTORY/jobs.json"
