name: Post-merge Deploy

# Thin CI lane. The source of truth lives at ops/ci/post-merge-deploy-lane.sh
# so local rehearsals and CI execute identical commands (jankurai HLT-042).
#
# Behavior:
#   - Triggered by completion of the "Rust" workflow on main.
#   - Gate stage requires conclusion=success and branch=main (or manual force).
#   - Build stage rebuilds the release binary at the triggering SHA and runs
#     scripts/deploy-local.sh --check (build + verify artifact).
#   - Deploy stage installs the artifact on a self-hosted runner labeled
#     'jeryu-deploy-target' and runs scripts/deploy-local.sh --verify.

on:
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the 'must follow a green Rust run' gate"
        required: false
        type: boolean
        default: false

concurrency:
  group: post-merge-deploy-${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: Gate (Rust workflow green?)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          WF_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WF_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$FORCE" = "true" ] && [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            EVENT_NAME=workflow_dispatch
          fi
          out="$(bash ops/ci/post-merge-deploy-lane.sh gate "$EVENT_NAME" "${WF_CONCLUSION:-success}" "${WF_BRANCH:-main}")"
          echo "$out"
          decision="$(echo "$out" | awk -F'\t' '{print $1}')"
          if [ "$decision" = "proceed" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "sha=${WF_SHA:-${{ github.sha }}}" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  build-artifact:
    name: Build release artifact
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install mold
        run: sudo apt-get install -y mold
      - id: version
        name: Resolve crate version
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building jeryu $v from ${{ needs.gate.outputs.sha }}"
      - name: Build + verify release binary
        run: bash ops/ci/post-merge-deploy-lane.sh build "${{ needs.gate.outputs.sha }}"
      - name: Verify artifact: TUI + tuiwright
        run: bash ops/ci/post-merge-deploy-lane.sh verify-tui
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jeryu-${{ steps.version.outputs.version }}-${{ needs.gate.outputs.sha }}
          path: target/release/jeryu
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to self-hosted target
    runs-on: [self-hosted, jeryu-deploy-target]
    timeout-minutes: 15
    needs: [gate, build-artifact]
    if: needs.gate.outputs.proceed == 'true'
    continue-on-error: true # If no self-hosted runner is available the job queues;
                            # build-artifact already ran full tuiwright suite + screenshots
                            # + recording. install-from-artifact does version/smoke/help
                            # verification + jeryu-web.service restart only.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jeryu-${{ needs.build-artifact.outputs.version }}-${{ needs.gate.outputs.sha }}
          path: target/release
      - name: Install + verify from artifact
        run: bash ops/ci/post-merge-deploy-lane.sh install-from-artifact target/release/jeryu
