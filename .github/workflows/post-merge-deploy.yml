name: Post-merge Deploy

# Runs after a successful merge to main. Builds the release binary, installs
# it globally on a self-hosted runner, and runs post-install verification
# (version match + TUI smoke + help check).
#
# Behavior:
#   - Triggered by completion of the "Rust" workflow on main (only the green path).
#   - Falls back to manual workflow_dispatch for emergency redeploys.
#   - Uses the `scripts/deploy-local.sh` script — same code path as a local rehearsal.
#   - Uploads the release binary as a build artifact for offline reuse.
#
# Self-hosted runner requirement:
#   - At least one runner must be labeled `self-hosted` AND `jeryu-deploy-target`.
#   - That runner must have write access to its $HOME/.local/bin (or set
#     JERYU_INSTALL_PREFIX to point elsewhere).
#
# If no self-hosted runner is available, the `build-artifact` job still runs on
# GitHub-hosted infrastructure and uploads the binary as an artifact; the
# `deploy` job will skip with a clear log message.

on:
  workflow_run:
    workflows: ["Rust"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the 'must follow a green Rust run' gate"
        required: false
        type: boolean
        default: false

concurrency:
  group: post-merge-deploy-${{ github.workflow }}-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  gate:
    name: Gate (Rust workflow green?)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - id: check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const force = '${{ inputs.force }}' === 'true';
            if (force) {
              core.info('manual force=true — bypassing gate');
              core.setOutput('proceed', 'true');
              core.setOutput('sha', context.sha);
              return;
            }
            if (context.eventName !== 'workflow_run') {
              core.setOutput('proceed', 'false');
              return;
            }
            const run = context.payload.workflow_run;
            if (run.conclusion !== 'success') {
              core.warning(`Triggering Rust run ended in '${run.conclusion}' — skipping deploy`);
              core.setOutput('proceed', 'false');
              return;
            }
            if (run.head_branch !== 'main') {
              core.info(`Triggering Rust run was on branch '${run.head_branch}' — skipping deploy`);
              core.setOutput('proceed', 'false');
              return;
            }
            core.info(`Rust run ${run.id} on main succeeded — proceeding to deploy ${run.head_sha}`);
            core.setOutput('proceed', 'true');
            core.setOutput('sha', run.head_sha);

  build-artifact:
    name: Build release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.95.0
      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install mold
        run: sudo apt-get install -y mold
      - id: version
        name: Resolve crate version
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building jeryu $v from ${{ needs.gate.outputs.sha }}"
      - name: Build release binary
        run: cargo build --release -p jeryu --bin jeryu
      - name: Verify built binary
        run: bash scripts/deploy-local.sh --check
      - name: Upload release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jeryu-${{ steps.version.outputs.version }}-${{ needs.gate.outputs.sha }}
          path: target/release/jeryu
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to self-hosted target
    runs-on: [self-hosted, jeryu-deploy-target]
    timeout-minutes: 15
    needs: [gate, build-artifact]
    if: needs.gate.outputs.proceed == 'true'
    continue-on-error: true # If no self-hosted runner is available, this job
                            # will queue/fail; build-artifact above still
                            # produces a downloadable binary.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - name: Download release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jeryu-${{ needs.build-artifact.outputs.version }}-${{ needs.gate.outputs.sha }}
          path: target/release
      - name: Make binary executable
        run: chmod 0755 target/release/jeryu
      - name: Install + verify
        run: |
          # Skip the rebuild — we already have the artifact from build-artifact.
          # The script's --verify mode would refuse without an install; use
          # the install path with build skipped.
          install -m 0755 target/release/jeryu "${JERYU_INSTALL_PREFIX:-$HOME/.local}/bin/jeryu"
          bash scripts/deploy-local.sh --verify
