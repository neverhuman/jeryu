name: jankurai

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: jankurai-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  security:
    name: Security strict preflight
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flock /tmp/rustup-install.lock rustup toolchain install 1.95.0 --no-self-update
          rustup override set 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install RedlineDB binary
        if: env.JERYU_DB_BACKEND == 'redlinedb'
        run: bash scripts/install-redlinedb.sh
      - name: Install cargo-deny
        uses: taiki-e/install-action@4276f5c5467209401f06d04b0026ae72e3bf4b97 # cargo-deny
      - name: Install actionlint (prebuilt binary)
        run: |
          if ! command -v actionlint >/dev/null 2>&1; then
            ACTIONLINT_VER=1.7.8
            TMP=$(mktemp -d)
            curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VER}/actionlint_${ACTIONLINT_VER}_linux_amd64.tar.gz" \
              | tar -xz -C "$TMP" actionlint
            mkdir -p "$HOME/.local/bin"
            mv "$TMP/actionlint" "$HOME/.local/bin/actionlint"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Install jankurai
        run: bash scripts/install-jankurai.sh
      - run: jankurai --version
      - name: Install gitleaks
        run: |
          if ! command -v gitleaks >/dev/null 2>&1; then
            VERSION="8.30.0"
            TMP=$(mktemp -d)
            curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "$TMP" gitleaks
            mkdir -p "$HOME/.local/bin"
            mv "$TMP/gitleaks" "$HOME/.local/bin/gitleaks"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          gitleaks version
      - name: Install syft
        run: |
          if ! command -v syft >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
              | sh -s -- -b "$HOME/.local/bin" v1.40.0
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
          syft --version
      - name: Workflow lint
        run: actionlint .github/workflows/*.yml
      - name: Security strict preflight
        run: bash ops/ci/jankurai-lane.sh security
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jankurai-part-security
          if-no-files-found: ignore
          path: target/jankurai/security/

  jankurai_audit:
    name: Jankurai Audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      security-events: write # SARIF upload to GitHub Security tab
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flock /tmp/rustup-install.lock rustup toolchain install 1.95.0 --no-self-update
          rustup override set 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install RedlineDB binary
        if: env.JERYU_DB_BACKEND == 'redlinedb'
        run: bash scripts/install-redlinedb.sh
      - name: Install jankurai
        run: bash scripts/install-jankurai.sh
      - run: jankurai --version
      - name: jankurai audit
        run: bash ops/ci/jankurai-lane.sh audit
        env:
          JANKURAI_SARIF_OUT: target/jankurai/jankurai.sarif
          JANKURAI_SUMMARY_OUT: target/jankurai/summary.md
          JANKURAI_REPAIR_QUEUE: target/jankurai/repair-queue.jsonl
      - name: Jankurai ratchet audit (advisory)
        # Ratchet mode is advisory until the post-release baseline is captured.
        continue-on-error: true
        run: |
          mkdir -p target/jankurai
          git show origin/main:agent/repo-score.json > target/jankurai/accepted-baseline.json
          JANKURAI_BASELINE=target/jankurai/accepted-baseline.json \
          JANKURAI_AUDIT_MODE=ratchet \
          bash ops/ci/jankurai-lane.sh audit
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jankurai-part-audit
          if-no-files-found: ignore
          path: |
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/jankurai.sarif
            target/jankurai/repair-queue.jsonl
      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('target/jankurai/jankurai.sarif') != ''
        uses: github/codeql-action/upload-sarif@d6bbdef45e766d081b84a2def353b0055f728d3e # v3
        with:
          sarif_file: target/jankurai/jankurai.sarif
          category: jankurai

  proof:
    name: Proof lanes
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flock /tmp/rustup-install.lock rustup toolchain install 1.95.0 --no-self-update
          rustup override set 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install RedlineDB binary
        if: env.JERYU_DB_BACKEND == 'redlinedb'
        run: bash scripts/install-redlinedb.sh
      - name: Install jankurai
        run: bash scripts/install-jankurai.sh
      - run: jankurai --version
      - name: Proof lanes
        run: bash ops/ci/jankurai-lane.sh proof
      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jankurai-part-proof
          if-no-files-found: ignore
          path: |
            target/jankurai/proofbind/
            target/jankurai/proofmark/
            target/jankurai/rust/

  tools:
    name: Audit tools
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flock /tmp/rustup-install.lock rustup toolchain install 1.95.0 --no-self-update
          rustup override set 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install RedlineDB binary
        if: env.JERYU_DB_BACKEND == 'redlinedb'
        run: bash scripts/install-redlinedb.sh
      - name: Install jankurai
        run: bash scripts/install-jankurai.sh
      - run: jankurai --version
      - name: Audit tools
        run: bash ops/ci/jankurai-lane.sh tools
      - name: Upload tool evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jankurai-part-tools
          if-no-files-found: ignore
          path: |
            agent-map.json
            test-map.json
            target/jankurai/aer-findings.json
            target/jankurai/ux-qa.json
            target/jankurai/migration-report.json

  bad_behavior:
    name: Bad-behavior checks
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flock /tmp/rustup-install.lock rustup toolchain install 1.95.0 --no-self-update
          rustup override set 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install RedlineDB binary
        if: env.JERYU_DB_BACKEND == 'redlinedb'
        run: bash scripts/install-redlinedb.sh
      - name: Install jankurai
        run: bash scripts/install-jankurai.sh
      - run: jankurai --version
      - name: Bad-behavior checks
        run: bash ops/ci/jankurai-lane.sh bad-behavior
      - name: Upload bad-behavior evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jankurai-part-bad-behavior
          if-no-files-found: ignore
          path: |
            target/jankurai/language-bad-behavior.log
            target/jankurai/ci-bad-behavior.log
            target/jankurai/git-bad-behavior.log
            target/jankurai/release-bad-behavior.log
            target/jankurai/db-boundary.log
            target/jankurai/ci-parity-drift.log

  sbom:
    name: CycloneDX SBOM
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Set up Rust (pinned via rust-toolchain.toml)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flock /tmp/rustup-install.lock rustup toolchain install 1.95.0 --no-self-update
          rustup override set 1.95.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install RedlineDB binary
        if: env.JERYU_DB_BACKEND == 'redlinedb'
        run: bash scripts/install-redlinedb.sh
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@8b2082c2d404d46ed01b1ea6ba5d10e26788c99e # cargo-cyclonedx
      - name: Install jankurai
        run: bash scripts/install-jankurai.sh
      - run: jankurai --version
      - name: Generate CycloneDX SBOM
        run: bash ops/ci/jankurai-lane.sh sbom
      - name: Attest build provenance
        if: always() && hashFiles('target/jankurai/sbom/*.json') != ''
        uses: actions/attest-build-provenance@92c65d2898f1f53cfdc910b962cecff86e7f8fcc # v1
        with:
          subject-path: target/jankurai/sbom/*.json
      - name: Upload SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jankurai-part-sbom
          if-no-files-found: ignore
          path: target/jankurai/sbom/

  audit:
    name: audit
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    needs:
      - security
      - jankurai_audit
      - proof
      - tools
      - bad_behavior
      - sbom
    if: always()
    steps:
      - name: Download split evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          pattern: jankurai-part-*
          path: target/jankurai
          merge-multiple: true
      - name: Upload combined evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          path: target/jankurai/
      - name: Check split lanes
        run: |
          failed=0
          for result in \
            "security=${{ needs.security.result }}" \
            "jankurai-audit=${{ needs.jankurai_audit.result }}" \
            "proof=${{ needs.proof.result }}" \
            "tools=${{ needs.tools.result }}" \
            "bad-behavior=${{ needs.bad_behavior.result }}" \
            "sbom=${{ needs.sbom.result }}"
          do
            echo "$result"
            case "$result" in
              *=success) ;;
              *) failed=1 ;;
            esac
          done
          exit "$failed"
