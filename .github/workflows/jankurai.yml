name: local-ci-parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ci-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  JERYU_CI_JOBS: "40"
  CARGO_BUILD_JOBS: "40"
  JANKURAI_REPO: "https://github.com/neverhuman/jankurai.git"
  JANKURAI_TAG: "v1.6.10-deadlang-precision"
  JANKURAI_REV: "68bd6114373cf407a930011b76669af306cb0cb1"

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without marketplace actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Ensure pinned jankurai on PATH
        run: bash ops/ci/ensure-jankurai.sh
      - name: Deterministic fast lane
        run: bash ops/ci/fast.sh
      - name: Security lane
        run: bash ops/ci/security.sh
      - name: Secret scan
        run: bash scripts/secret-scan.sh
      - name: Dependency scan
        run: cargo audit --deny warnings && cargo deny check licenses sources bans advisories
      - name: Provenance and SBOM scan
        run: cargo test -p jeryu-signrail --jobs "$JERYU_CI_JOBS"
      - name: Jankurai audit lane
        run: bash ops/ci/jankurai.sh
      - name: Jankurai full score artifacts
        run: jankurai . --json .jankurai/repo-score.json --md .jankurai/repo-score.md --fail-under 85
