name: local-ci-parity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ci-parity-${{ github.ref }}
  cancel-in-progress: true

env:
  JERYU_CI_JOBS: "40"
  CARGO_BUILD_JOBS: "40"
  JERYU_JANKURAI_STRICT_TAG: "0"
  JANKURAI_REPO: "https://github.com/neverhuman/jankurai.git"
  JANKURAI_TAG: "v1.6.10-deadlang-precision"
  JANKURAI_REV: "68bd6114373cf407a930011b76669af306cb0cb1"

jobs:
  jankurai-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without marketplace actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Ensure pinned jankurai on PATH
        run: bash ops/ci/ensure-jankurai.sh
      - name: Jankurai audit lane
        run: export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"; bash ops/ci/ensure-jankurai.sh; jankurai audit . --json .jankurai/repo-score.json --md .jankurai/repo-score.md --fail-under 85
