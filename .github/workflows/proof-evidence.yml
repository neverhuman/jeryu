name: proof-evidence

# Jankurai tool-adoption CI lane: runs the catalog `ci_command` for every tool
# that genuinely executes in this repo and uploads each tool's `artifact_paths`
# via actions/upload-artifact. Tools whose catalog ci_command does not run in
# this repo (cargo run -p jankurai / cargo test -p jankurai, the ux-qa node CLI,
# the security-lane.sh harness, the vibe_coding tips corpus, db migrations) are
# intentionally omitted rather than faked.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-evidence-${{ github.ref }}
  cancel-in-progress: true

env:
  JERYU_JANKURAI_BASE_REF: "origin/main"

jobs:
  tool-adoption-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout without marketplace actions
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Ensure jankurai on PATH
        run: |
          if ! command -v jankurai >/dev/null 2>&1; then
            cargo install jankurai --version 1.6.1 --locked
          fi
          jankurai --version

      - name: Prepare output dirs
        run: mkdir -p .jankurai target/jankurai target/jankurai/rust target/jankurai/coverage

      # audit-ci / proof-routing / contract-drift / authz-matrix / input-boundary /
      # agent-tool-supply / release-readiness / cost-budget all share this ratchet
      # ci_command in the catalog. The advisory pass produces the .jankurai/*
      # artifacts (the catalog artifact_paths) and the accepted baseline; the
      # ratchet pass is the scoring gate that the catalog command names.
      - name: Audit advisory (produce score + repair-queue artifacts + baseline)
        run: |
          jankurai audit . --mode advisory \
            --json .jankurai/repo-score.json \
            --md .jankurai/repo-score.md \
            --repair-queue-jsonl target/jankurai/repair-queue.jsonl
          cp .jankurai/repo-score.json target/jankurai/accepted-baseline.json

      - name: Audit ratchet gate (catalog ci_command)
        run: jankurai audit . --mode ratchet --baseline target/jankurai/accepted-baseline.json --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md

      # rust-witness catalog ci_command.
      - name: Rust witness graph (catalog ci_command)
        run: jankurai rust witness build .

      # coverage-evidence catalog ci_command. Parses coverage/proof artifacts;
      # does not run tests. Reports missing sources in advisory mode.
      - name: Coverage evidence audit (catalog ci_command)
        run: jankurai coverage audit . --config agent/coverage-sources.toml --json target/jankurai/coverage/coverage-audit.json --md target/jankurai/coverage/coverage-audit.md

      # Upload every wired tool's artifact_paths. `if: always()` so evidence is
      # captured even when the ratchet score gate fails.
      - name: Upload tool-adoption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jankurai-tool-adoption-evidence
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/repair-queue.jsonl
            target/jankurai/rust/witness-graph.json
            target/jankurai/coverage/coverage-audit.json
            target/jankurai/coverage/coverage-audit.md
          if-no-files-found: error
