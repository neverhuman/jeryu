name: Jankurai score

on:
  schedule:
    - cron: '47 5 * * *'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jankurai-score-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  score:
    name: Complete audit census
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap apparmor
      - name: Admit unprivileged audit sandbox
        run: bash scripts/check-audit-sandbox.sh --prepare-disposable-ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Audit every enrolled scope
        env:
          JERYU_AUDIT_OUTPUT_ROOT: ${{ runner.temp }}/jeryu-audit-census
        run: bash scripts/ci.sh audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-census-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/jeryu-audit-census/attempt.*/census/census.json
            ${{ runner.temp }}/jeryu-audit-census/attempt.*/census/*/audit.log
            ${{ runner.temp }}/jeryu-audit-census/attempt.*/census/*/report.json
            ${{ runner.temp }}/jeryu-audit-census/attempt.*/census/*/report.md
          retention-days: 30
