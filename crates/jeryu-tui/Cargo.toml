[package]
name = "jeryu-tui"
version = "0.1.0"
edition = "2024"
description = "Ratatui Flight Deck for the jeryu control plane — pure projections of the jeryu-readmodel contract."
license = "MIT OR Apache-2.0"

[dependencies]
jeryu-readmodel = { path = "../jeryu-readmodel" }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm_0_29", "underline-color", "all-widgets", "macros", "layout-cache"] }
crossterm = "0.29.0"

[dev-dependencies]
# (tests render through ratatui's TestBackend; no extra deps required)
