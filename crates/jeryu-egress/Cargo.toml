[package]
name = "jeryu-egress"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Host-allowlist forward egress proxy (HTTP CONNECT + plain HTTP) with a budget kill switch for jeryu cells"

[lib]
name = "jeryu_egress"
path = "src/lib.rs"

[[bin]]
name = "jeryu-egress"
path = "src/bin/jeryu-egress.rs"

[dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
