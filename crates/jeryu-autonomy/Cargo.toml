[package]
name = "jeryu-autonomy"
version = "0.1.0"
edition = "2024"
description = "Evidence-Gate autonomous-delivery control plane for jeryu: hard-stop condition registry, verdict fusion, append-only signed ledger, kill-bell pause/resume, and escalation dispatch."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
