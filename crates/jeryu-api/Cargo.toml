[package]
name = "jeryu-api"
version = "0.10.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
jeryu-bench = { path = "../jeryu-bench" }
jeryu-obs = { path = "../jeryu-obs" }
jeryu-enterprise = { path = "../jeryu-enterprise" }
jeryu-ci-compiler = { path = "../jeryu-ci-compiler", optional = true }
jeryu-ci-ir = { path = "../jeryu-ci-ir", optional = true }
jeryu-core = { path = "../jeryu-core" }
jeryu-autonomy = { path = "../jeryu-autonomy", optional = true }
jeryu-gitd = { path = "../jeryu-gitd", optional = true }
jeryu-mcp = { path = "../jeryu-mcp", optional = true }
jeryu-readmodel = { path = "../jeryu-readmodel" }
jeryu-runner-core = { path = "../jeryu-runner-core", optional = true }
jeryu-runnerd = { path = "../jeryu-runnerd", optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
clap = { workspace = true }
futures-util = { version = "0.3", optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tower = "0.5"

[features]
default = []
web = ["dep:axum", "dep:futures-util", "dep:hex", "dep:jeryu-autonomy", "dep:jeryu-ci-compiler", "dep:jeryu-ci-ir", "dep:jeryu-gitd", "dep:jeryu-mcp", "dep:jeryu-runner-core", "dep:jeryu-runnerd", "dep:sha2", "dep:tokio", "dep:tower-http", "dep:uuid"]

[lints]
workspace = true
