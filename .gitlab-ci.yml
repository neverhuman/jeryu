# .gitlab-ci.yml — full-parity translation of all GitHub Actions workflows
#
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │  DAG SCHEDULE — 3 runners, wall-clock timing                                │
# │                                                                             │
# │  t=0  (needs:[] — all start immediately, queued across available runners):  │
# │    ● fmt  ● clippy  ● supply-chain                                          │
# │    ● fixture-project-test  ● fixture-project-clippy                         │
# │    ● build  (stage=build, needs:[] bypasses the check-stage barrier)        │
# │    ● build-release  (stage=deploy, needs:[] — main push only)               │
# │                                                                             │
# │  t≈build (~30m):                                                            │
# │    test-select · install-smoke · ssh-install-e2e                            │
# │    jankurai-security · jankurai-audit · jankurai-sbom                       │
# │    witness · vrc-map · vrc-plan · aer-scan · tui-smoke · tui-screenshots    │
# │                                                                             │
# │  t≈build+select (~35m):                                                     │
# │    test-lib · test-mock · test-integration                                  │
# │                                                                             │
# │  t≈tests (~80m):  jankurai-ratchet (advisory, allow_failure)                │
# │                   release-ready (gate, MR→main only)                        │
# │                   deploy-local (main push only, needs all critical tests)   │
# │                                                                             │
# │  t≈81m:  verify-deploy (shell runner — checks jeryu --version on host)     │
# │                                                                             │
# │  Critical path: build(30) → test-select(5) → test-integration(45) ≈ 80m   │
# │  Previous:  clippy(25) → build(30) → select(5) → integ(45) ≈ 105m         │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Source-of-truth scripts (unchanged — local rehearsals and CI share them):
#   ops/ci/rust-lane.sh          → rust.yml jobs
#   ops/ci/jankurai-lane.sh      → jankurai.yml jobs
#   ops/ci/release-lane.sh       → release.yml jobs
#   ops/ci/release-ready-lane.sh → release-ready.yml gate
#
# GitHub → GitLab translation key:
#   pull_request / merge_group   → CI_PIPELINE_SOURCE == "merge_request_event"
#   push: branches: [main]       → CI_COMMIT_BRANCH == "main" && SOURCE == "push"
#   push: tags: ["v*"]           → CI_COMMIT_TAG =~ /^v/
#   schedule: (weekly)           → CI_PIPELINE_SOURCE == "schedule"
#   workflow_dispatch            → CI_PIPELINE_SOURCE == "trigger" or RELEASE_VERSION var set
#   cancel-in-progress: true     → interruptible: true
#   continue-on-error: true      → allow_failure: true
#   actions/upload-artifact      → artifacts: paths:
#   actions/download-artifact    → needs: [job] + artifacts: true
#   GITHUB_TOKEN                 → CI_JOB_TOKEN / GITHUB_TOKEN CI var (for GitHub API)
#   GITHUB_SHA                   → CI_COMMIT_SHA
#   GITHUB_REPOSITORY            → CI_PROJECT_PATH
#
# Required GitLab CI/CD variables (project Settings → CI/CD → Variables):
#   GITHUB_TOKEN  — PAT for github.com/neverhuman/jeryu (release publish + emit-status)
#   (optional) JERYU_DB_BACKEND — "redlinedb" to use RedlineDB instead of SQLite

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  JERYU_DB_BACKEND: sqlite
  # Full history needed for VTI shadow-tests and origin/main comparisons.
  GIT_DEPTH: 0

stages:
  - check         # t=0 parallel: fmt · clippy · supply-chain · fixture-project-*
  - build         # t=0 via needs:[] (parallel with check): cargo build workspace
  - verify        # after build (+ test-select for test jobs): tests · audits · tui
  - gate          # after critical tests: release-ready composite gate
  - deploy        # main push only: build-release (signed artifact) + deploy-local
  - verify-deploy # main push only: confirm jeryu --version on host matches new SHA
  - release-prep  # version resolution · audit · security (tag/manual)
  - release-build # release binary
  - release-proof # provenance · SBOM · rollback-check · evidence
  - publish       # create GitHub release

# ─────────────────────────────────────────────────────────────────────────────
# Shared templates
# ─────────────────────────────────────────────────────────────────────────────

# Install Rust toolchain (from rust-toolchain.toml) and the mold linker.
# Mold is installed once here so individual jobs don't repeat it.
.rust-toolchain:
  before_script:
    - |
      if ! command -v rustup >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain none --no-modify-path
        source "$HOME/.cargo/env"
      fi
    - rustup show   # installs / verifies pinned toolchain from rust-toolchain.toml
    - |
      # mold linker — speeds up incremental link steps for all jobs
      if ! command -v mold >/dev/null 2>&1; then
        sudo apt-get install -y -qq mold 2>/dev/null \
          || apt-get install -y -qq mold 2>/dev/null \
          || true
      fi

# Cargo registry + build cache. Keyed on Cargo.lock + rust-toolchain.toml.
# Uses pull-push so any cache-warming run benefits the next job.
.cargo-cache:
  cache:
    key:
      files:
        - Cargo.lock
        - rust-toolchain.toml
    paths:
      - target/
      - .cargo-cache/registry/cache/
      - .cargo-cache/git/db/
    policy: pull-push
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-cache

# Read-only cache for jobs that don't produce cache-worthy new artifacts.
.cargo-cache-pull:
  cache:
    key:
      files:
        - Cargo.lock
        - rust-toolchain.toml
    paths:
      - target/
      - .cargo-cache/registry/cache/
      - .cargo-cache/git/db/
    policy: pull
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-cache

# Rules: MR targeting any branch, push to main, scheduled runs.
.on-mr-and-main:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# Rules: v* tag push, or manual trigger with RELEASE_VERSION variable set.
.on-release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual

# ─────────────────────────────────────────────────────────────────────────────
# CHECK STAGE  — t=0, all start immediately via needs:[]
# Equivalent to: rust.yml (fmt, clippy), rust.yml (fixture-project-*),
#                rust.yml (supply-chain / cargo-deny)
# ─────────────────────────────────────────────────────────────────────────────

fmt:
  stage: check
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs: []
  timeout: 10 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh fmt

clippy:
  stage: check
  extends: [.rust-toolchain, .cargo-cache, .on-mr-and-main]
  needs: []
  timeout: 30 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh clippy

# cargo-deny supply-chain audit — reads Cargo.lock only, no compiled artifacts needed.
supply-chain:
  stage: check
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs: []
  timeout: 30 minutes
  interruptible: true
  script:
    - cargo install cargo-deny --locked --quiet 2>/dev/null || true
    - |
      export PATH="$HOME/go/bin:$PATH"
      if ! command -v actionlint >/dev/null 2>&1; then
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8 2>/dev/null || true
      fi
    - bash ops/ci/rust-lane.sh supply-chain
  artifacts:
    name: security-evidence
    paths:
      - target/jankurai/security/
    expire_in: 7 days
    when: always

# Fixture project — self-contained mini-crate, no main-workspace artifacts needed.
# Split into two parallel jobs so test + clippy run on separate runners.
fixture-project-test:
  stage: check
  extends: [.rust-toolchain, .cargo-cache, .on-mr-and-main]
  needs: []
  timeout: 30 minutes
  interruptible: true
  script:
    - cd tests/fixtures/fixture_project
    - bash ../../../ops/ci/rust-lane.sh fixture-project-test

fixture-project-clippy:
  stage: check
  extends: [.rust-toolchain, .cargo-cache, .on-mr-and-main]
  needs: []
  timeout: 30 minutes
  interruptible: true
  script:
    - cd tests/fixtures/fixture_project
    - bash ../../../ops/ci/rust-lane.sh fixture-project-clippy

# ─────────────────────────────────────────────────────────────────────────────
# BUILD STAGE  — t=0 via needs:[], runs in parallel with the entire check stage
# Equivalent to: rust.yml (build)
# ─────────────────────────────────────────────────────────────────────────────

build:
  stage: build
  extends: [.rust-toolchain, .cargo-cache, .on-mr-and-main]
  # needs:[] bypasses the check-stage barrier — build starts at t=0, in parallel
  # with fmt/clippy/supply-chain/fixture-project-*.
  # MRs with lint failures will have both build AND lint results visible at the same time.
  needs: []
  timeout: 35 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh build
  artifacts:
    name: jeryu-debug-build
    paths:
      - target/debug/jeryu
    expire_in: 1 day
    when: on_success

# ─────────────────────────────────────────────────────────────────────────────
# VERIFY STAGE  — jobs fan out immediately after their deps finish
# No stage-barrier waits; every job carries explicit needs:.
# ─────────────────────────────────────────────────────────────────────────────

# ── VTI test-selection ───────────────────────────────────────────────────────

# Runs as soon as build is done. Emits vti.env (VTI_MODE, VTI_FILTER) consumed
# by test-lib, test-mock, test-integration.
test-select:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 20 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh test-select
    - |
      VTI_MODE=$(jq -r '.mode // "full"' target/jeryu/test-plan.json 2>/dev/null || echo "full")
      VTI_FILTER=$(jq -r '
        [ .selected_tests[]
          | select(.kind == "unit_filter")
          | .command
          | gsub("^cargo nextest run -E '"'"'"; "")
          | gsub("'"'"'$"; "")
        ] | join(" | ")
      ' target/jeryu/test-plan.json 2>/dev/null || echo "")
      echo "VTI_MODE=${VTI_MODE}" >> vti.env
      echo "VTI_FILTER=${VTI_FILTER}" >> vti.env
      echo "VTI mode: ${VTI_MODE}, filter: ${VTI_FILTER:-(full run)}"
  artifacts:
    paths:
      - target/jeryu/test-plan.json
    reports:
      dotenv: vti.env
    expire_in: 1 day

# ── Tests (fan out from build + test-select) ─────────────────────────────────

test-lib:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
    - job: test-select
      artifacts: true
  timeout: 30 minutes
  interruptible: true
  script:
    - |
      if [ "${VTI_MODE:-full}" = "docs_only" ]; then
        echo "VTI mode is docs_only — skipping test-lib"; exit 0
      fi
    - cargo install cargo-nextest --locked --quiet 2>/dev/null || true
    - bash ops/ci/rust-lane.sh test-lib "${VTI_MODE:-full}" "${VTI_FILTER:-}"

test-mock:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
    - job: test-select
      artifacts: true
  timeout: 10 minutes
  interruptible: true
  script:
    - |
      if [ "${VTI_MODE:-full}" = "docs_only" ]; then
        echo "VTI mode is docs_only — skipping test-mock"; exit 0
      fi
    - cargo install cargo-nextest --locked --quiet 2>/dev/null || true
    - bash ops/ci/rust-lane.sh test-mock

test-integration:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: test-select
      artifacts: true
  timeout: 45 minutes
  interruptible: true
  script:
    - |
      if [ "${VTI_MODE:-full}" = "docs_only" ]; then
        echo "VTI mode is docs_only — skipping test-integration"; exit 0
      fi
    - bash ops/ci/rust-lane.sh test-integration

install-smoke:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 30 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh install-smoke

ssh-install-e2e:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 30 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh ssh-install-e2e
  artifacts:
    paths:
      - target/ci-evidence/ssh-install/
    expire_in: 7 days
    when: always

# ── Jankurai — split into 3 parallel jobs, all need only build ───────────────

# jankurai-security: gitleaks secrets scan + security audit lane.
# Lightest job — runs gitleaks (no compiler) + jankurai security lane.
jankurai-security:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: false
  timeout: 15 minutes
  interruptible: true
  allow_failure: true   # jankurai tool-adoption.toml id mismatch (pre-existing, advisory)
  script:
    - |
      VERSION="8.30.0"
      if ! command -v gitleaks >/dev/null 2>&1; then
        curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin gitleaks 2>/dev/null \
          || curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
             | tar -xz -C "$HOME/.local/bin" gitleaks
      fi
      gitleaks version
    - bash scripts/install-jankurai.sh
    - bash ops/ci/jankurai-lane.sh security
  artifacts:
    name: jankurai-security-evidence
    paths:
      - target/jankurai/security/
    expire_in: 7 days
    when: always

# jankurai-audit: scoring · SARIF · proofbind · tools · bad-behavior lanes.
jankurai-audit:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: false
  timeout: 30 minutes
  interruptible: true
  script:
    - |
      if [ "${JERYU_DB_BACKEND:-sqlite}" = "redlinedb" ]; then
        bash scripts/install-redlinedb.sh
      fi
    - |
      export PATH="$HOME/go/bin:$PATH"
      if ! command -v actionlint >/dev/null 2>&1; then
        go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8 2>/dev/null || true
      fi
    - bash scripts/install-jankurai.sh
    - jankurai --version
    # Lint GitHub Actions workflows — advisory on GitLab (they still run on GitHub)
    - export PATH="$HOME/go/bin:$PATH" && actionlint .github/workflows/*.yml || true
    - |
      mkdir -p target/jankurai
      JANKURAI_SARIF_OUT=target/jankurai/jankurai.sarif \
      JANKURAI_SUMMARY_OUT=target/jankurai/summary.md \
      JANKURAI_REPAIR_QUEUE=target/jankurai/repair-queue.jsonl \
      bash ops/ci/jankurai-lane.sh audit
    - bash ops/ci/jankurai-lane.sh proof
    - bash ops/ci/jankurai-lane.sh tools
    - bash ops/ci/jankurai-lane.sh bad-behavior
  artifacts:
    name: jankurai-adoption-evidence
    paths:
      - target/jankurai/repo-score.json
      - target/jankurai/repo-score.md
      - target/jankurai/jankurai.sarif
      - target/jankurai/repair-queue.jsonl
      - target/jankurai/proofbind/obligations.json
      - target/jankurai/proofbind/surface-witness.json
      - target/jankurai/proofmark/proofmark-receipt.json
      - target/jankurai/proofmark/proof-receipt.json
      - target/jankurai/rust/witness-graph.json
      - target/jankurai/aer-findings.json
      - target/jankurai/language-bad-behavior.log
      - target/jankurai/ci-bad-behavior.log
      - target/jankurai/git-bad-behavior.log
      - target/jankurai/release-bad-behavior.log
      - target/jankurai/ux-qa.json
      - target/jankurai/migration-report.json
    expire_in: 7 days
    when: always

# jankurai-sbom: CycloneDX SBOM generation — independent of audit scoring.
jankurai-sbom:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: false
  timeout: 15 minutes
  interruptible: true
  script:
    - cargo install cargo-cyclonedx --locked --quiet 2>/dev/null || true
    - |
      # Install syft for additional SBOM metadata
      if ! command -v syft >/dev/null 2>&1; then
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
          | sudo sh -s -- -b /usr/local/bin v1.40.0 2>/dev/null \
          || curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
             | sh -s -- -b "$HOME/.local/bin" v1.40.0
      fi
      syft --version
    - |
      mkdir -p target/jankurai/sbom
      cargo cyclonedx --format json --override-filename sbom || true
      find . -maxdepth 4 -name 'sbom.cdx.json' -not -path './target/jankurai/*' \
        -exec mv {} target/jankurai/sbom/ \; 2>/dev/null || true
    # Note: GitHub Sigstore attestation (actions/attest-build-provenance) is GitHub-specific.
    # GitLab Premium offers artifact signing; SBOM is stored as artifact in the meantime.
  artifacts:
    name: jankurai-sbom
    paths:
      - target/jankurai/sbom/
    expire_in: 7 days
    when: always

# Advisory score-ratchet — runs after audit has scored the commit.
# allow_failure mirrors continue-on-error: true in jankurai.yml.
jankurai-ratchet:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: jankurai-audit
      artifacts: false
  timeout: 20 minutes
  interruptible: true
  allow_failure: true
  script:
    - bash scripts/install-jankurai.sh
    - mkdir -p target/jankurai
    - |
      git show origin/main:agent/repo-score.json > target/jankurai/accepted-baseline.json 2>/dev/null \
        || echo '{}' > target/jankurai/accepted-baseline.json
    - |
      JANKURAI_BASELINE=target/jankurai/accepted-baseline.json \
      JANKURAI_AUDIT_MODE=ratchet \
      bash ops/ci/jankurai-lane.sh audit

# ── Witness / VRC / AER (fan out from build) ─────────────────────────────────

witness:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 20 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh witness
  artifacts:
    name: witness-graph
    paths:
      - .witness/witness-graph.json
    expire_in: 7 days
    when: always

vrc-map:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 15 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh vrc-map
  artifacts:
    name: vrc-maps
    paths:
      - agent-map.json
      - test-map.json
    expire_in: 7 days
    when: always

vrc-plan:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 15 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh vrc-plan
  artifacts:
    name: vrc-plan
    paths:
      - vrc-plan.json
    expire_in: 7 days
    when: always

aer-scan:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 15 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh aer
  artifacts:
    name: aer-findings
    paths:
      - aer-findings.json
    expire_in: 7 days
    when: always

# ── TUI smoke + screenshots (fan out from build) ─────────────────────────────

tui-smoke:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 15 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh tui-smoke

tui-screenshots:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull, .on-mr-and-main]
  needs:
    - job: build
      artifacts: true
  timeout: 20 minutes
  interruptible: true
  # Prevents concurrent media commits on main if two pipelines overlap.
  resource_group: git-push-main
  script:
    - bash ops/ci/rust-lane.sh tui-screenshots
    - bash ops/ci/rust-lane.sh tui-recording
    - bash ops/ci/update-tui-readme-media.sh
    # Commit refreshed media back to main (mirrors: if github.ref == 'refs/heads/main')
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ] && [ "$CI_COMMIT_BRANCH" = "main" ]; then
        if git diff --quiet -- README.md assets/tui-demo.gif assets/tui-workflow.png assets/tui-jobs.png assets/tui-bugs.png; then
          echo "README TUI media is already current"
        else
          git config user.name "gitlab-ci[bot]"
          git config user.email "41898282+gitlab-ci[bot]@users.noreply.gitlab.com"
          git add README.md assets/tui-demo.gif assets/tui-workflow.png assets/tui-jobs.png assets/tui-bugs.png
          git commit -m "docs: refresh TUI README media [skip ci]"
          git push \
            "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
            "HEAD:refs/heads/main"
        fi
      fi
  artifacts:
    name: tui-screenshots
    paths:
      - target/ci-screenshots/
      - assets/tui-demo.gif
      - assets/tui-workflow.png
      - assets/tui-jobs.png
      - assets/tui-bugs.png
    expire_in: 7 days
    when: always

# ── Weekly scheduled hardening — schedule-only, no build dep needed ───────────

scheduled-hardening:
  stage: verify
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  timeout: 30 minutes
  interruptible: true
  script:
    - bash ops/ci/rust-lane.sh hardening
  artifacts:
    name: hardening-aer-findings
    paths:
      - target/hardening/aer-findings.json
    expire_in: 7 days
    when: always

# ─────────────────────────────────────────────────────────────────────────────
# GATE STAGE  (≡ release-ready.yml)
#
# Requires ALL critical test + audit jobs before firing.
# On GitLab the pipeline job status IS the MR gate (JERYU_EMIT_STATUS=0).
# The jeryu server independently posts vibegate/merge-passport via
# post_merge_passport_status() — orthogonal to this CI gate.
# ─────────────────────────────────────────────────────────────────────────────

release-ready:
  stage: gate
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    # Binary + binary artifact
    - job: build
      artifacts: true
    # Lint (must pass before merging)
    - job: fmt
      artifacts: false
    - job: clippy
      artifacts: false
    # Supply-chain (cargo-deny must be clean)
    - job: supply-chain
      artifacts: false
    # Tests
    - job: test-lib
      artifacts: false
    - job: test-mock
      artifacts: false
    - job: test-integration
      artifacts: false
    # Audit evidence (gate reads SARIF + scoring artifacts)
    - job: jankurai-audit
      artifacts: true
    - job: jankurai-security
      artifacts: true
    # Witness graph
    - job: witness
      artifacts: true
  timeout: 30 minutes
  rules:
    # Gate MRs targeting main (mirrors: on: pull_request: branches: [main])
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    # Also run on direct pushes to main so green main always has a passing gate
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  variables:
    # Dry-run: validate receipts locally — GitLab pipeline status is the gate for MRs.
    JERYU_EMIT_STATUS: "0"
    PR_NUMBER: $CI_MERGE_REQUEST_IID
  script:
    - bash ops/ci/release-ready-lane.sh "${CI_MERGE_REQUEST_IID:-0}"

# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY STAGE  — main push only (never runs on MRs)
#
# build-release  : compiles optimised release binary with git SHA embedded in
#                  the version string (JERYU_BUILD_META=g{short_sha}).
#                  Also generates a sha256 checksum file for integrity checks.
#
# deploy-local   : atomically installs the binary on THIS machine at
#                  ~/.jeryu/bin/jeryu (and ~/.cargo/bin/jeryu if writable).
#                  REQUIRES shell executor runner (tag: jeryu-default).
#                  The script self-detects Docker and exits with a clear message
#                  if it's running in a container instead of on the host shell.
#
# verify-deploy  : runs `jeryu --version` via the same shell runner and asserts
#                  the output contains the expected commit short SHA, confirming
#                  the host binary was actually updated.
# ─────────────────────────────────────────────────────────────────────────────

# Rules shared by all deploy jobs — main push only.
.on-main-push:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'

# Build the optimised release binary with embedded git SHA.
# Starts at t=0 in parallel with the debug build and lint jobs.
build-release:
  stage: deploy
  extends: [.rust-toolchain, .cargo-cache, .on-main-push]
  # needs:[] → starts immediately at pipeline t=0 (same as build + lint)
  needs: []
  timeout: 45 minutes
  interruptible: true
  variables:
    # Embed the commit short SHA into the binary version string.
    # build.rs reads this and emits JERYU_FULL_VERSION="{pkg_ver}+g{sha}".
    JERYU_BUILD_META: "g${CI_COMMIT_SHORT_SHA}"
  script:
    - bash ops/ci/rust-lane.sh build-release 2>/dev/null || cargo build --release -p jeryu
    - sha256sum target/release/jeryu | tee target/release/jeryu.sha256
    - echo "Release binary version:"
    - target/release/jeryu --version
  artifacts:
    name: "jeryu-release-${CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/jeryu
      - target/release/jeryu.sha256
    expire_in: 30 days
    when: on_success

# Atomically install the release binary on the local host.
# Tags: [jeryu-default] — must be a shell executor runner.
deploy-local:
  stage: deploy
  extends: [.on-main-push]
  # Wait until the release binary is built AND all critical tests have passed.
  # We do NOT deploy a binary that failed tests.
  needs:
    - job: build-release
      artifacts: true
    - job: fmt
      artifacts: false
    - job: clippy
      artifacts: false
    - job: test-lib
      artifacts: false
    - job: test-mock
      artifacts: false
    - job: test-integration
      artifacts: false
    - job: jankurai-audit
      artifacts: false
    - job: jankurai-security
      artifacts: false
  tags:
    - jeryu-default
  timeout: 5 minutes
  script:
    - bash ops/ci/deploy-local-lane.sh target/release/jeryu
  artifacts:
    name: deploy-receipt-${CI_COMMIT_SHORT_SHA}
    paths:
      - "$HOME/.jeryu/last-deploy.json"
    expire_in: 7 days
    when: always

# ─────────────────────────────────────────────────────────────────────────────
# VERIFY-DEPLOY STAGE  — confirms the host binary was updated
# ─────────────────────────────────────────────────────────────────────────────

verify-deploy:
  stage: verify-deploy
  extends: [.on-main-push]
  needs:
    - job: deploy-local
      artifacts: false
  tags:
    - jeryu-default
  timeout: 2 minutes
  script:
    - |
      EXPECTED="${CI_COMMIT_SHORT_SHA}"
      INSTALLED=$(jeryu --version 2>&1)
      echo "Installed: $INSTALLED"
      echo "Expected SHA fragment: $EXPECTED"
      if echo "$INSTALLED" | grep -q "$EXPECTED"; then
        echo "✓ Deploy verified — host binary contains commit $EXPECTED"
      else
        echo "✗ Deploy verification FAILED"
        echo "  jeryu --version reported: $INSTALLED"
        echo "  Expected it to contain:   $EXPECTED"
        echo ""
        echo "  Possible causes:"
        echo "  1. deploy-local ran on a different runner than this verify job"
        echo "  2. ~/.jeryu/bin is not on PATH for this runner"
        echo "  3. build-release did not embed JERYU_BUILD_META correctly"
        exit 1
      fi
    - |
      echo "--- Deploy receipt ---"
      cat "$HOME/.jeryu/last-deploy.json" 2>/dev/null || echo "(receipt not found)"

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE PIPELINE  (≡ release.yml)
#
# Triggered by v* tag push OR by setting RELEASE_VERSION + manual trigger.
#   workflow_dispatch.inputs.version → RELEASE_VERSION CI variable
#   workflow_dispatch.inputs.dry_run → RELEASE_DRY_RUN CI variable ("true"/"false")
#   push: tags: ["v*"]              → CI_COMMIT_TAG
# ─────────────────────────────────────────────────────────────────────────────

release-preflight:
  stage: release-prep
  extends: [.rust-toolchain, .cargo-cache]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 15 minutes
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        GITHUB_EVENT_NAME=push GITHUB_REF_NAME="$CI_COMMIT_TAG" \
          bash ops/ci/release-resolve.sh > release.env
      else
        INPUT_VERSION="$RELEASE_VERSION" INPUT_DRY_RUN="${RELEASE_DRY_RUN:-false}" \
        GITHUB_EVENT_NAME=workflow_dispatch \
          bash ops/ci/release-resolve.sh > release.env
      fi
      echo "Resolved release vars:"; cat release.env
    - source release.env 2>/dev/null || eval "$(cat release.env)"
    - bash ops/ci/release-lane.sh preflight "$version"
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 1 day

# release-audit and release-security run in parallel once preflight resolves the version.
release-audit:
  stage: release-prep
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 20 minutes
  script:
    - bash ops/ci/release-lane.sh audit "$version"

release-security:
  stage: release-prep
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 20 minutes
  script:
    - bash ops/ci/release-lane.sh security "$version"

# Release build starts as soon as preflight is green (parallel with audit+security).
release-build:
  stage: release-build
  extends: [.rust-toolchain, .cargo-cache]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 45 minutes
  script:
    - bash ops/ci/release-lane.sh build "$version"
  artifacts:
    name: jeryu-binary
    paths:
      - target/release/jeryu
    expire_in: 7 days

# release-provenance and release-rollback-check fan out in parallel after release-build.
release-provenance:
  stage: release-proof
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
    - job: release-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 25 minutes
  script:
    - bash ops/ci/release-lane.sh provenance "$version"
    # Note: GitHub Sigstore attestation not ported (GitHub-specific).
    # Add cosign/sigstore signing here if required.
  artifacts:
    paths:
      - target/jankurai/sbom/
    expire_in: 30 days

release-rollback-check:
  stage: release-proof
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 5 minutes
  script:
    - bash ops/ci/release-lane.sh rollback-check "$version"

release-evidence:
  stage: release-proof
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
    - job: release-audit
      artifacts: false
    - job: release-security
      artifacts: false
    - job: release-build
      artifacts: true
    - job: release-provenance
      artifacts: true
    - job: release-rollback-check
      artifacts: false
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 15 minutes
  script:
    - bash ops/ci/release-lane.sh evidence "$version"
  artifacts:
    name: release-evidence
    paths:
      - ops/releases/
    expire_in: 30 days

release-publish:
  stage: publish
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
    - job: release-audit
      artifacts: false
    - job: release-security
      artifacts: false
    - job: release-build
      artifacts: true
    - job: release-provenance
      artifacts: true
    - job: release-evidence
      artifacts: true
    - job: release-rollback-check
      artifacts: false
  rules:
    # Only publish for real tag pushes when not a dry run (mirrors: if: dry_run != 'true')
    - if: '$CI_COMMIT_TAG =~ /^v/ && $RELEASE_DRY_RUN != "true"'
  environment: release
  timeout: 30 minutes
  # GITHUB_TOKEN must be set as a masked CI variable: project Settings → CI/CD → Variables.
  # release-lane.sh publish creates a GitHub Release on neverhuman/jeryu via gh CLI.
  script:
    - bash ops/ci/release-lane.sh publish "$version"
