    - bash ops/ci/rust-lane.sh hardening
  artifacts:
    name: hardening-aer-findings
    paths:
      - target/hardening/aer-findings.json
    expire_in: 7 days
    when: always

# ─────────────────────────────────────────────────────────────────────────────
# GATE STAGE  (≡ release-ready.yml)
#
# The GitHub version posts a Check Run to GitHub (JERYU_EMIT_STATUS=1).
# On GitLab, the pipeline job status IS the MR gate — no separate check posting
# needed. JERYU_EMIT_STATUS stays at 0; the gate still validates all receipts
# locally so any failure blocks the MR.
#
# The jeryu server separately posts a GitLab commit status
# (vibegate/merge-passport) via post_merge_passport_status() — that is the
# VibeGate autonomous approval layer, orthogonal to this CI gate.
# ─────────────────────────────────────────────────────────────────────────────

release-ready:
  stage: gate
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: build
      artifacts: true
  timeout: 30 minutes
  rules:
    # Gate only MRs targeting main (mirrors: on: pull_request: branches: [main])
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
    # Also run on direct pushes to main so green main always has a passing gate
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  variables:
    # Dry-run: validate receipts locally without posting to GitHub.
    # The GitLab pipeline status is the gate for MRs.
    JERYU_EMIT_STATUS: "0"
    PR_NUMBER: $CI_MERGE_REQUEST_IID
  script:
    - bash ops/ci/release-ready-lane.sh "${CI_MERGE_REQUEST_IID:-0}"

# ─────────────────────────────────────────────────────────────────────────────
# RELEASE PIPELINE  (≡ release.yml)
#
# Triggered by v* tag push OR by setting RELEASE_VERSION + manual trigger.
# Maps:
#   workflow_dispatch.inputs.version → RELEASE_VERSION CI variable
#   workflow_dispatch.inputs.dry_run → RELEASE_DRY_RUN CI variable ("true"/"false")
#   push: tags: ["v*"]              → CI_COMMIT_TAG
# ─────────────────────────────────────────────────────────────────────────────

release-preflight:
  stage: release-prep
  extends: [.rust-toolchain, .cargo-cache]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 15 minutes
  script:
    # Derive version + dry_run from GitLab context (maps GITHUB_EVENT_NAME/GITHUB_REF_NAME)
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        GITHUB_EVENT_NAME=push GITHUB_REF_NAME="$CI_COMMIT_TAG" \
          bash ops/ci/release-resolve.sh > release.env
      else
        # Manual trigger via RELEASE_VERSION variable
        INPUT_VERSION="$RELEASE_VERSION" INPUT_DRY_RUN="${RELEASE_DRY_RUN:-false}" \
        GITHUB_EVENT_NAME=workflow_dispatch \
          bash ops/ci/release-resolve.sh > release.env
      fi
      echo "Resolved release vars:"; cat release.env
    - source release.env 2>/dev/null || eval "$(cat release.env)"
    - bash ops/ci/release-lane.sh preflight "$version"
  artifacts:
    reports:
      dotenv: release.env
    expire_in: 1 day

release-audit:
  stage: release-prep
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 20 minutes
  script:
    - bash ops/ci/release-lane.sh audit "$version"

release-security:
  stage: release-prep
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 20 minutes
  script:
    - bash ops/ci/release-lane.sh security "$version"

release-build:
  stage: release-build
  extends: [.rust-toolchain, .cargo-cache]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 45 minutes
  script:
    - bash ops/ci/release-lane.sh build "$version"
  artifacts:
    name: jeryu-binary
    paths:
      - target/release/jeryu
    expire_in: 7 days

release-provenance:
  stage: release-proof
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
    - job: release-build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 25 minutes
  script:
    - bash ops/ci/release-lane.sh provenance "$version"
    # Note: GitHub Sigstore attestation (actions/attest-build-provenance) is not ported.
    # SBOM is captured below; add cosign/sigstore signing here if required.
  artifacts:
    paths:
      - target/jankurai/sbom/
    expire_in: 30 days

release-rollback-check:
  stage: release-proof
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 5 minutes
  script:
    - bash ops/ci/release-lane.sh rollback-check "$version"

release-evidence:
  stage: release-proof
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
    - job: release-audit
      artifacts: false
    - job: release-security
      artifacts: false
    - job: release-build
      artifacts: true
    - job: release-provenance
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$RELEASE_VERSION != null && $RELEASE_VERSION != ""'
      when: manual
  timeout: 15 minutes
  script:
    - bash ops/ci/release-lane.sh evidence "$version"
  artifacts:
    name: release-evidence
    paths:
      - ops/releases/
    expire_in: 30 days

release-publish:
  stage: publish
  extends: [.rust-toolchain, .cargo-cache-pull]
  needs:
    - job: release-preflight
      artifacts: true
    - job: release-audit
      artifacts: false
    - job: release-security
      artifacts: false
    - job: release-build
      artifacts: true
    - job: release-provenance
      artifacts: true
    - job: release-evidence
      artifacts: true
    - job: release-rollback-check
      artifacts: false
  rules:
    # Only publish for real tag pushes when not dry-run (mirrors: if: dry_run != 'true')
    - if: '$CI_COMMIT_TAG =~ /^v/ && $RELEASE_DRY_RUN != "true"'
  environment: release
  timeout: 30 minutes
  # GITHUB_TOKEN must be set as a masked CI variable in project Settings → CI/CD → Variables
  # release-lane.sh publish creates a GitHub Release on neverhuman/jeryu via gh CLI.
  script:
    - bash ops/ci/release-lane.sh publish "$version"
