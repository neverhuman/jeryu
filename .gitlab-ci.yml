stages:
  - quality
  - build
  - test
  - evidence
  - release
  - deploy

variables:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GIT_DEPTH: "1"
  PATH: /usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

default:
  image: rust:1.95.0@sha256:39d8cb39a54e7d1da665c4fabfdd265e532a5f836c11ab5aee27fd5c73891ce4
  timeout: 30m

.workflow_rules_main: &rules_main
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.workflow_rules_rust: &rules_rust
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^web-forge\//'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: never

# ---------------------------------------------------------------------------
# Rust pipeline mirror
# ---------------------------------------------------------------------------

ci_runner_policy:
  stage: quality
  rules: *rules_rust
  script:
    - bash scripts/ci/no-runner-tags.sh .

gitlab_source_auth_doctor:
  stage: quality
  allow_failure: true
  rules: *rules_rust
  script:
    - bash scripts/ci/ci-job-token-clone-doctor.sh

rust_fmt:
  stage: quality
  rules: *rules_rust
  script:
    - rustup component add rustfmt
    - bash ops/ci/rust-lane.sh fmt

rust_clippy:
  stage: quality
  rules: *rules_rust
  script:
    - rustup component add clippy
    - bash ops/ci/rust-lane.sh clippy

rust_build:
  stage: build
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh build

rust_install_smoke:
  stage: build
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh install-smoke

rust_test_select:
  stage: test
  needs: []
  rules: *rules_rust
  variables:
    GIT_DEPTH: "0"
  script:
    - bash ops/ci/rust-lane.sh test-select
  artifacts:
    paths:
      - target/jeryu/test-plan.json
    expire_in: 1 day

rust_test_lib:
  stage: test
  needs: [rust_test_select]
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh test-lib

rust_test_mock:
  stage: test
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh test-mock

rust_test_integration:
  stage: test
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh test-integration

rust_tui_smoke:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh tui-smoke

jeryu_health_self:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - mkdir -p target/jeryu
    - cargo run -p jeryu --bin jeryu -- health --ci --json > target/jeryu/health.json
    - python3 -c 'import json; from pathlib import Path; data = json.loads(Path("target/jeryu/health.json").read_text(encoding="utf-8")); raise SystemExit(1) if not data.get("ok") else None'
  artifacts:
    when: always
    paths:
      - target/jeryu/health.json
    expire_in: 1 week

rust_supply_chain:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - cargo install -q --locked cargo-deny --force
    - bash ops/ci/rust-lane.sh supply-chain

rust_witness:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh witness

rust_vrc_map:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh vrc-map

rust_vrc_plan:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh vrc-plan

rust_aer_scan:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh aer

rust_scheduled_hardening:
  stage: evidence
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - bash ops/ci/rust-lane.sh hardening

rust_ssh_install_e2e:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh ssh-install-e2e
  artifacts:
    when: always
    paths:
      - target/ci-evidence/ssh-install/
    expire_in: 1 week

rust_tui_screenshots:
  stage: evidence
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh tui-screenshots
    - bash ops/ci/rust-lane.sh tui-recording
    - bash ops/ci/update-tui-readme-media.sh

rust_fixture_project_tests:
  stage: test
  needs: []
  rules: *rules_rust
  script:
    - bash ops/ci/rust-lane.sh fixture-project-test
    - bash ops/ci/rust-lane.sh fixture-project-clippy

# ---------------------------------------------------------------------------
# Jankurai pipeline mirror
# ---------------------------------------------------------------------------

jankurai_security:
  stage: quality
  allow_failure: true
  rules: *rules_main
  script:
    - bash scripts/install-jankurai.sh
    - bash ops/ci/jankurai-lane.sh security

jankurai_audit:
  stage: quality
  rules: *rules_main
  script:
    - bash scripts/install-jankurai.sh
    - bash ops/ci/jankurai-lane.sh audit

jankurai_proof:
  stage: quality
  allow_failure: true
  rules: *rules_main
  script:
    - bash scripts/install-jankurai.sh
    - bash ops/ci/jankurai-lane.sh proof

jankurai_tools:
  stage: quality
  allow_failure: true
  rules: *rules_main
  script:
    - bash scripts/install-jankurai.sh
    - bash ops/ci/jankurai-lane.sh tools

jankurai_bad_behavior:
  stage: quality
  rules: *rules_main
  script:
    - bash scripts/install-jankurai.sh
    - bash ops/ci/jankurai-lane.sh bad-behavior

jankurai_sbom:
  stage: quality
  allow_failure: true
  rules: *rules_main
  script:
    - bash scripts/install-jankurai.sh
    - bash ops/ci/jankurai-lane.sh sbom

# ---------------------------------------------------------------------------
# Release-ready mirror
# ---------------------------------------------------------------------------

release_ready:
  stage: quality
  rules: *rules_main
  variables:
    GITHUB_TOKEN: "$GITHUB_TOKEN"
    GITHUB_REPOSITORY: "$CI_PROJECT_PATH"
    GITHUB_SHA: "$CI_MERGE_REQUEST_SOURCE_BRANCH_SHA"
    PR_NUMBER: "$CI_MERGE_REQUEST_IID"
    JERYU_EMIT_STATUS: "0"
  script:
    - bash ops/ci/release-ready-lane.sh

# ---------------------------------------------------------------------------
# Release workflow mirror
# ---------------------------------------------------------------------------

release_preflight:
  stage: build
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION'
    - when: never
  variables:
    INPUT_DRY_RUN: "$RELEASE_DRY_RUN"
    GITHUB_OUTPUT: "$CI_PROJECT_DIR/.release-resolve.env"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ -n "${CI_COMMIT_TAG:-}" ]; then
        export GITHUB_EVENT_NAME=push
        export GITHUB_REF_NAME="$CI_COMMIT_TAG"
      else
        export GITHUB_EVENT_NAME=workflow_dispatch
        export INPUT_VERSION="${RELEASE_VERSION:-}"
        export INPUT_DRY_RUN="${RELEASE_DRY_RUN:-false}"
      fi
      bash ops/ci/release-resolve.sh
  artifacts:
    reports:
      dotenv: .release-resolve.env

release_audit:
  stage: release
  needs: [release_preflight]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG != ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION != ""'
  script:
    - bash ops/ci/release-lane.sh audit "$version"

release_security:
  stage: release
  needs: [release_preflight]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG != ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION != ""'
  script:
    - bash ops/ci/release-lane.sh security "$version"

release_build:
  stage: release
  needs: [release_preflight]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG != ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION != ""'
  script:
    - bash ops/ci/release-lane.sh build "$version"

release_provenance:
  stage: release
  needs: [release_preflight, release_build]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG != ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION != ""'
  script:
    - bash ops/ci/release-lane.sh provenance "$version"

release_evidence:
  stage: release
  needs:
    - release_preflight
    - release_build
    - release_audit
    - release_security
    - release_provenance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG != ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION != ""'
  script:
    - bash ops/ci/release-lane.sh evidence "$version"

release_rollback_check:
  stage: release
  needs: [release_preflight]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG != ""'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION != ""'
  script:
    - bash ops/ci/release-lane.sh rollback-check "$version"

release_publish:
  stage: release
  needs:
    - release_preflight
    - release_audit
    - release_security
    - release_build
    - release_provenance
    - release_evidence
    - release_rollback_check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG != "" && $dry_run != "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION != "" && $dry_run != "true"'
    - when: never
  script:
    - bash ops/ci/release-lane.sh publish "$version"

# ---------------------------------------------------------------------------
# Post-merge deploy mirror
# ---------------------------------------------------------------------------

post_merge_build_artifact:
  stage: build
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  script:
    - bash ops/ci/post-merge-deploy-lane.sh build "$CI_COMMIT_SHA"
    - bash ops/ci/post-merge-deploy-lane.sh verify-tui
  artifacts:
    paths:
      - target/release/jeryu
    expire_in: 1 day

# Deploys the verified artifact to the host machine. This is isolated from the
# standard local GitLab path by a manual rule and an explicit operator variable.
# The runner must be a dedicated shell executor that accepts untagged jobs.
post_merge_deploy:
  stage: deploy
  needs: [post_merge_build_artifact]
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $ENABLE_HOST_DEPLOY == "1"'
      when: manual
    - when: never
  script:
    - bash ops/ci/post-merge-deploy-lane.sh install-from-artifact target/release/jeryu

# ---------------------------------------------------------------------------
# Web Forge mirror — mirrors .github/workflows/web.yml so MR pipelines run the
# same proof lanes as GitHub Actions (HLT-042 CI/local/parity).
# ---------------------------------------------------------------------------

.workflow_rules_web: &rules_web
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
  - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ /^web-forge\//'

.web_node_bootstrap: &web_node_bootstrap
  - |
    if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
      . ops/ci/lib.sh
      install_ci_packages nodejs npm
      if ! command -v node >/dev/null 2>&1 && command -v nodejs >/dev/null 2>&1; then
        ln -sf "$(command -v nodejs)" /usr/local/bin/node
      fi
    fi

.web_playwright_bootstrap: &web_playwright_bootstrap
  - |
    if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1 || ! command -v npx >/dev/null 2>&1; then
      . ops/ci/lib.sh
      install_ci_packages nodejs npm curl tar
      if ! command -v node >/dev/null 2>&1 && command -v nodejs >/dev/null 2>&1; then
        ln -sf "$(command -v nodejs)" /usr/local/bin/node
      fi
    fi

web_rust_feature:
  stage: test
  needs: []
  rules: *rules_web
  script:
    - rustup component add rustfmt clippy
    - cargo install -q --locked cargo-nextest --force
    - cargo fmt --all -- --check
    - cargo check --workspace --features web
    - cargo clippy --workspace --features web --all-targets -- -D warnings
    - cargo nextest run -p jeryu --features web --no-fail-fast
    - cargo run --bin jeryu_export_types --features web
    - git diff --exit-code contracts/generated/
    - cargo run --bin jeryu_export_schemas --features web
    - git diff --exit-code schemas/

web_frontend_checks:
  stage: test
  needs: []
  rules: *rules_web
  before_script: *web_node_bootstrap
  script:
    - npm ci --no-audit --no-fund
    - npm --workspace @jeryu/web run typecheck
    - npm --workspace @jeryu/web run lint
    - npm --workspace @jeryu/web run test

web_frontend_build:
  stage: build
  needs: []
  rules: *rules_web
  before_script: *web_node_bootstrap
  script:
    - npm ci --no-audit --no-fund
    - npm --workspace @jeryu/web run build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 day
    when: always

web_frontend_storybook:
  stage: build
  needs: []
  rules: *rules_web
  before_script: *web_node_bootstrap
  script:
    - npm ci --no-audit --no-fund
    - npm --workspace @jeryu/web run build-storybook
  artifacts:
    paths:
      - apps/web/storybook-static/
    expire_in: 1 day
    when: always

web_uxqa_build:
  stage: evidence
  needs: [web_frontend_build, web_frontend_storybook]
  rules: *rules_web
  before_script: *web_node_bootstrap
  script:
    - node apps/ux-qa/ux-qa-check.mjs build
  artifacts:
    when: always
    paths:
      - target/jankurai/ux-qa/
    expire_in: 1 week

web_e2e:
  stage: evidence
  needs: [web_rust_feature, web_frontend_build]
  rules: *rules_web
  before_script: *web_playwright_bootstrap
  variables:
    JERYU_WEB_TRUST_LOCAL: "1"
    JERYU_LOCAL_USERS: "alice:repo.read,repo.write|bob:repo.read"
    JERYU_PLAYWRIGHT_E2E_MODE: bff-only
  script:
    - npm ci --no-audit --no-fund
    - npm --workspace @jeryu/web run build
    - cargo build --release --features web -p jeryu
    - (cd apps/web && npx playwright install chromium --with-deps)
    - |
      pick_local_port() {
        start="$1"
        for candidate in "$start" 18789 18790 18791 18792; do
          if ! { : >"/dev/tcp/127.0.0.1/$candidate"; } >/dev/null 2>&1; then
            printf '%s\n' "$candidate"
            return
          fi
        done
        printf '%s\n' "$start"
      }
      BFF_LOG="target/jankurai/ux-qa/bff-e2e.log"
      BFF_PORT="${JERYU_PLAYWRIGHT_BFF_PORT:-$(pick_local_port 18788)}"
      BFF_BASE_URL="http://127.0.0.1:${BFF_PORT}"
      JERYU_WEB_BIN="${CARGO_TARGET_DIR:-target}/release/jeryu"
      test -x "$JERYU_WEB_BIN"
      mkdir -p "$(dirname "$BFF_LOG")"
      JERYU_WEB_TRUST_LOCAL=1 "$JERYU_WEB_BIN" web serve --bind "127.0.0.1:${BFF_PORT}" --spa-dir apps/web/dist > "$BFF_LOG" 2>&1 &
      BFF_PID=$!
      cleanup_bff() {
        status=$?
        kill "$BFF_PID" 2>/dev/null || true
        if [ "$status" -ne 0 ]; then
          echo "BFF log ($BFF_LOG):" >&2
          cat "$BFF_LOG" >&2 || true
        fi
        exit "$status"
      }
      trap cleanup_bff EXIT
      for i in $(seq 1 30); do
        if curl -fs "$BFF_BASE_URL/health" >/dev/null 2>&1; then
          echo "BFF up after ${i}s"
          break
        fi
        sleep 1
      done
      curl -fs "$BFF_BASE_URL/health"
      export JERYU_PLAYWRIGHT_EXTERNAL_BFF=1
      export JERYU_PLAYWRIGHT_BFF_URL="$BFF_BASE_URL"
    - (cd apps/web && npx playwright test)
    - node apps/ux-qa/ux-qa-check.mjs test
  artifacts:
    when: always
    paths:
      - apps/web/playwright-report/
      - target/jankurai/ux-qa/
    expire_in: 1 week

web_lighthouse:
  stage: evidence
  needs: [web_frontend_build]
  rules: *rules_web
  allow_failure: true
  before_script: *web_playwright_bootstrap
  script:
    - npm ci --no-audit --no-fund
    - npm --workspace @jeryu/web run build
    - cargo build --release --features web -p jeryu
    - (cd apps/web && npx playwright install chromium --with-deps)
    - |
      pick_local_port() {
        start="$1"
        for candidate in "$start" 18789 18790 18791 18792; do
          if ! { : >"/dev/tcp/127.0.0.1/$candidate"; } >/dev/null 2>&1; then
            printf '%s\n' "$candidate"
            return
          fi
        done
        printf '%s\n' "$start"
      }
      BFF_LOG="target/jankurai/ux-qa/bff-lighthouse.log"
      BFF_PORT="${JERYU_LIGHTHOUSE_PORT:-$(pick_local_port 18787)}"
      BFF_BASE_URL="http://127.0.0.1:${BFF_PORT}"
      JERYU_WEB_BIN="${CARGO_TARGET_DIR:-target}/release/jeryu"
      test -x "$JERYU_WEB_BIN"
      mkdir -p "$(dirname "$BFF_LOG")"
      JERYU_WEB_TRUST_LOCAL=1 "$JERYU_WEB_BIN" web serve --bind "127.0.0.1:${BFF_PORT}" --spa-dir apps/web/dist > "$BFF_LOG" 2>&1 &
      BFF_PID=$!
      cleanup_bff() {
        status=$?
        kill "$BFF_PID" 2>/dev/null || true
        if [ "$status" -ne 0 ]; then
          echo "BFF log ($BFF_LOG):" >&2
          cat "$BFF_LOG" >&2 || true
        fi
        exit "$status"
      }
      trap cleanup_bff EXIT
      for i in $(seq 1 30); do
        if curl -fs "$BFF_BASE_URL/health" >/dev/null 2>&1; then
          echo "BFF up after ${i}s"
          break
        fi
        sleep 1
      done
      curl -fs "$BFF_BASE_URL/health"
      export JERYU_LIGHTHOUSE_URL="$BFF_BASE_URL/"
      export CHROME_PATH="$(cd apps/web && node -e 'console.log(require("playwright").chromium.executablePath())')"
      test -x "$CHROME_PATH"
      npm --workspace @jeryu/web run perf
  artifacts:
    when: always
    paths:
      - apps/web/.lighthouseci/
      - target/jankurai/ux-qa/lighthouse/
      - target/jankurai/ux-qa/bff-lighthouse.log
    expire_in: 1 week
