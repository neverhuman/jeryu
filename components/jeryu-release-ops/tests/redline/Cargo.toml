# Deliberately isolated: SQLite release builds must never resolve Redline.
[workspace]
resolver = "3"

[package]
name = "jeryu-redline-contract"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dev-dependencies]
redlinedb = { git = "https://github.com/neverhuman/redline-core.git", tag = "redline-core-v4.1.0-jain.6" }
tempfile = "3"
serde_json = "1"
