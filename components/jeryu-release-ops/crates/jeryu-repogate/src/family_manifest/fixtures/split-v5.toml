schema_version = "1"
repo_family = "jeryu-split"
release_identity = "jeryu-split"
release_lineage = "v5"
status = "candidate"
formal_ga = false
split_root = "/home/ubuntu/jain-split/jeryu-split"
manifest_authority = "/home/ubuntu/jain-split/jeryu-split/jeryu-release-ops/repos.manifest.toml"
compliance_state = "inventory"
required_repos = [
  "jeryu",
  "jeryu-cache",
  "jeryu-ci-runner",
  "jeryu-core",
  "jeryu-deploy",
  "jeryu-intelligence",
  "jeryu-jira",
  "jeryu-release-ops",
  "jeryu-tool",
  "jeryu-tool-finder",
  "jeryu-web",
]
retired_histories = []

[forges.local_transition]
provider = "jeryu"
base_url = "http://127.0.0.1:8787"
git_url_template = "http://127.0.0.1:8787/git/{owner}/{repo}.git"

[forges.hosted]
provider = "jeryu"
base_url = "https://git.neverhuman.org"
git_url_template = "https://git.neverhuman.org/git/{owner}/{repo}.git"

[compliance]
minimum_jankurai_score = 85
max_authored_lines = 500
target_authored_lines = 300
max_raw_git_blob_bytes = 1048576
max_caps = 0
max_hard_findings = 0
max_soft_findings = 0
max_disabled_rules = 0
allowed_score_drop = 0

[control_plane]
authority_forge = "hosted"
name = "jeryu-release-ops"
path = "/home/ubuntu/jain-split/jeryu-split/jeryu-release-ops"
jeryu_slug = "jeryu/jeryu-release-ops"
remote = "https://git.neverhuman.org/git/jeryu/jeryu-release-ops.git"
required_check = "jeryu-release-ops/required"
default_branch = "main"
identity_status = "bound"
predecessor_tag = "jeryu-release-ops-v5.0.0-split.6"
inventory_status = "active"
runtime_authority = "control-plane"
lfs_required = false

[nested_families.redline]
