[package]
name = "jeryu-readmodel"
version.workspace = true
edition = "2024"
description = "Provider-neutral TUI/web read-model contract types for the jeryu control plane."
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# ts-rs is the source of truth for the web/TUI wire contracts in
# `src/contracts/`. `serde-compat` lets ts-rs honor `#[serde(rename_all, tag)]`
# so the emitted TypeScript matches the JSON wire shape. The regenerated
# bindings are committed under `contracts/generated/` and guarded by the
# byte-identity drift test in `tests/contract_drift.rs`.
ts-rs = { version = "12", features = ["serde-compat"] }
