requires_network = false

[[lane]]
name = "security-tool-hostiles"
command = "bash tests/security_lane_test.sh"
purpose = "reject shell-function, PATH, release-root, and tool-custody substitution"
requires_network = false

[[lane]]
name = "contract-hostiles"
command = "bash tests/contract_drift_test.sh"
purpose = "reject public API, tool, source, and receipt substitution"
requires_network = false

[[lane]]
name = "artifact-hostiles"
command = "bash tests/artifact_support_test.sh"
purpose = "reject artifact, tool, source, and physical custody substitution"
requires_network = false
