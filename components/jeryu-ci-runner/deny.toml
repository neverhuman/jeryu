[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Cargo identity stays on this historical immutable source while the checked-in
# transport overlay and source gate require the effective network destination
# to be git.neverhuman.org.
allow-git = ["https://github.com/neverhuman/jeryu-core.git"]
