[[lane]]
name = "fast"
command = "just fast"
purpose = "locked deterministic workspace compile check"
requires_network = false

[[lane]]
name = "check"
command = "just check"
purpose = "full locked workspace format, lint, metadata, and test gate"
requires_network = false

[[lane]]
name = "score"
command = "just score"
purpose = "pinned full Jankurai repository score and hard-finding gate"
requires_network = false

[[lane]]
name = "security"
command = "just security"
purpose = "fixed-version secret, workflow, advisory, source, and SBOM checks"
requires_network = true

[[lane]]
name = "contract"
command = "just contract-drift"
purpose = "runner wire Rust-to-schema drift and hostile mutation checks"
requires_network = false

[[lane]]
name = "artifact-support"
command = "just artifact-support"
purpose = "source-repository artifact support metadata check"
requires_network = false

[[lane]]
