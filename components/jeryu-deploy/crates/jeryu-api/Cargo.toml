[package]
name = "jeryu-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
anyhow = { version = "1" }
base64 = { version = "0.22", optional = true }
chrono.workspace = true
jeryu-bench = { workspace = true }
jeryu-obs = { workspace = true }
jeryu-enterprise = { workspace = true }
jeryu-ci-compiler = { workspace = true, optional = true }
jeryu-ci-ir = { workspace = true, optional = true }
jeryu-core = { workspace = true }
jeryu-codegraph = { workspace = true, optional = true }
jeryu-agent-stream = { workspace = true, optional = true }
jeryu-agentbridge = { workspace = true, optional = true }
jeryu-autonomy = { workspace = true, optional = true }
jeryu-gitd = { workspace = true, optional = true }
jeryu-jira = { workspace = true }
jeryu-mcp = { workspace = true, optional = true }
jeryu-readmodel = { workspace = true }
jeryu-runner-core = { workspace = true, optional = true }
jeryu-runner-oci = { workspace = true, optional = true }
jeryu-runnerd = { workspace = true, optional = true }
jeryu-wsversion = { workspace = true, optional = true }
axum = { version = "0.7", features = ["ws"], optional = true }
clap = { workspace = true }
futures-util = { version = "0.3", optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
toml = { workspace = true }
uuid = { workspace = true, optional = true }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.13", features = ["json"] }
tempfile = { workspace = true }
tower = "0.5"

[features]
default = []
web = ["dep:axum", "dep:base64", "dep:flate2", "dep:futures-util", "dep:hex", "dep:jeryu-agent-stream", "dep:jeryu-agentbridge", "dep:jeryu-autonomy", "dep:jeryu-ci-compiler", "dep:jeryu-ci-ir", "dep:jeryu-codegraph", "dep:jeryu-gitd", "dep:jeryu-mcp", "dep:jeryu-runner-core", "dep:jeryu-runner-oci", "dep:jeryu-runnerd", "dep:jeryu-wsversion", "dep:sha2", "dep:tokio", "dep:uuid"]

[lints]
workspace = true
