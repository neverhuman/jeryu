# tools-registry.toml — the reusable-code-tool registry for the jeryu family.
#
# jeryu-tool's second pillar (see docs/tools-registry.md). tool-manifest.toml
# governs the jankurai AUDIT toolchain; THIS file is the catalogue of reusable
# code tools the family ships and shares. The forge "golden box" on /repos reads
# it via GET /api/v1/tools/registry/summary; ops/registry-summary.sh validates it.
#
# PROVENANCE OF LOC FIGURES: entries below are PREPOPULATED from the real
# jankurai ecosystem (crates: tuiwright, jankurai-guard, ...) and the jankurai
# tool catalog. Their loc_saved values are CONSERVATIVE OPERATOR ESTIMATES of the
# per-repo duplication each centralized tool/crate prevents — they are not yet
# finder-measured. jeryu-tool-finder refines them with measured cross-repo
# duplication; new proposals it files (status=proposed) start at loc_saved = 0.

schema_version = "1"

