schema_version = "1.0.0"

# Tools this control-plane repo genuinely adopts in CI (see ops/ci/ + the
# workflow). Mode "auto" lets jankurai assess applicability and CI evidence.

[[tools]]
id = "audit-ci"        # ops/ci/score.sh runs `jankurai audit` and uploads .jankurai/
mode = "auto"

[[tools]]
id = "security"        # ops/ci/security.sh runs gitleaks/actionlint and writes evidence
mode = "auto"

[[tools]]
id = "ci-bad-behavior" # the workflow pins every action by commit SHA
mode = "auto"

[[tools]]
id = "git-bad-behavior" # no destructive git automation in this repo
mode = "auto"

[[tools]]
id = "proof-routing"
mode = "auto"

[[tools]]
id = "proofbind"
mode = "auto"

[[tools]]
id = "proofmark-rust"
mode = "auto"

[[tools]]
id = "copy-code"
mode = "auto"

[[tools]]
id = "release-bad-behavior"
mode = "auto"

[[tools]]
id = "contract-drift"
mode = "auto"

[[tools]]
id = "rust-witness"
mode = "auto"

[[tools]]
id = "authz-matrix"
mode = "auto"

[[tools]]
id = "input-boundary"
mode = "auto"

[[tools]]
id = "agent-tool-supply"
mode = "auto"

[[tools]]
id = "release-readiness"
mode = "auto"

# This repository has no paid API, hosted service, or unbounded billable job.
# CI has explicit ten-minute job timeouts, so a spend-budget tool is inapplicable.
[[tools]]
id = "cost-budget"
mode = "disabled"

[[tools]]
id = "coverage-evidence"
mode = "auto"
