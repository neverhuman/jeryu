# Jeryu jankurai audit policy.
#
# Run as:  jankurai audit . --policy agent/audit-policy.toml
#
# Loading this pins the policy fingerprint (reproducible runs) and carries the
# documented domain-term allowlist below with the repo. It scopes intent WITHOUT
# excluding product code, so every real dead-language / fallback-soup / security
# check still runs on every crate and on the web surface.

minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low"]

[history]
max_rows = 500
max_bytes = 1048576
dedupe = "consecutive-equivalent"
mirror_env = "JANKURAI_HISTORY_MIRROR"
mirror_required = false
mirror_max_rows = 5000

[scan]
# Excluded from scanning because they are NOT product code:
#   tips/, AGENT_CHAT.md, CI_TRACKER.md  -> narrative / coordination notes.
#   .jankurai/                           -> the auditor's OWN output (score
#                                           json/md, score history) — auditing
#                                           the auditor's artifacts is circular.
#   web/eslint.config.js                 -> lint tooling configuration; its
#                                           content is ESLint rule identifiers
#                                           (e.g. `no-unused-vars`) and browser
#                                           global declarations, not product
#                                           logic.
# We deliberately do NOT exclude any crates/** or apps/web/src/** path: excluding
# product code would weaken real checks.
excluded_paths = [
  "tips/",
  "AGENT_CHAT.md",
  "CI_TRACKER.md",
  ".jankurai/",
  "apps/web/eslint.config.js",
  "apps/web/playwright-report/",
]

[smart_scan]
full_scan_interval_secs = 3600
roulette_rate = 0.10

# --- Dead-language term allowlist (opt-in) ----------------------------------
#
# jankurai's HLT-001 future-hostile/dead-language heuristic is a bare-word
# matcher. A few of its words are LOAD-BEARING API / protocol / domain names in
# this GitHub-compatible forge + React SPA — renaming them would break GitHub
# parity, the React/HTML platform contract, or the client/server wire protocol.
# The `[dead_language] allow_terms` mechanism (jankurai >= 1.6.1) suppresses ONLY
# these exact words for the dead-marker check; every other dead-language,
# fallback-soup, and security check still runs on the same files. Each term is
# justified below; this is a reviewed, documented decision, not a blanket
# disable (process markers like todo/fixme/hack/stub are deliberately NOT listed).
#
#   stale       -> GitHub CheckConclusion REST value "stale" (jeryu-api/github.rs
#                  wire mapping; the Rust variant is renamed `Superseded`, but the
#                  wire STRING must stay); SPA-facing backend error codes
#                  (merge_sha_stale / merge_passport_stale / settings_hash_stale);
#                  the GitHub `dismiss_stale_approvals` branch-protection field.
#   placeholder -> the HTML `<input placeholder>` attribute / React prop name.
#   fallback    -> the React `<Suspense fallback>` / ErrorBoundary prop name.
#   old         -> unified-diff side labels + git ref-update `<old-oid> <new-oid>`.
#
# NOTE: the MarkdownRenderer.tsx (sanitized `dangerouslySetInnerHTML`, DOMPurify +
# server ammonia, with an existing XSS negative test W-FE-09) and realtimeStore.ts
# (sessionStorage of a non-secret WS resume cursor) findings are separate
# security-detector false-positives, not dead-language; they are documented here
# but not yet suppressible by this section.
[dead_language]
allow_terms = ["stale", "placeholder", "fallback", "old"]
