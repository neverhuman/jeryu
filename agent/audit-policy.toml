# Jeryu jankurai audit policy.
#
# Run as:  jankurai audit . --policy agent/audit-policy.toml
#
# Loading this pins the policy fingerprint (reproducible runs) and carries the
# documented domain-term allowlist below with the repo. It scopes intent WITHOUT
# excluding product code, so every real dead-language / fallback-soup / security
# check still runs on every crate and on the web surface.

minimum_score = 85
fail_on = ["critical", "high"]
advisory_on = ["medium", "low"]

[history]
max_rows = 500
max_bytes = 1048576
dedupe = "consecutive-equivalent"
mirror_env = "JANKURAI_HISTORY_MIRROR"
mirror_required = false
mirror_max_rows = 5000

[scan]
# Excluded from scanning because they are NOT product code:
#   tips/, AGENT_CHAT.md, CI_TRACKER.md  -> narrative / coordination notes.
#   .jankurai/                           -> the auditor's OWN output (score
#                                           json/md, score history) — auditing
#                                           the auditor's artifacts is circular.
#   web/eslint.config.js                 -> lint tooling configuration; its
#                                           content is ESLint rule identifiers
#                                           (e.g. `no-unused-vars`) and browser
#                                           global declarations, not product
#                                           logic.
# We deliberately do NOT exclude any crates/** or web/src/** path: excluding
# product code would weaken real checks.
excluded_paths = ["tips/", "AGENT_CHAT.md", "CI_TRACKER.md", ".jankurai/", "web/eslint.config.js"]

[smart_scan]
full_scan_interval_secs = 3600
roulette_rate = 0.10

# --- Accepted tool false-positives (DOCUMENTATION ONLY) ---------------------
#
# jankurai 1.6.0 has NO honest mechanism to allowlist a dead-language term or to
# scope a single rule to a path. Verified exhaustively (probe, 2026-05-31): 9
# policy-section variants ([domain_terms]/[dead_language]/[hlt_001]/[vibe]/
# [lexicon]/[terms]/[allowlist]/...), 6 per-rule path-scoping variants, inline
# ignore markers, --baseline, and docs/exceptions/*.md were ALL silently ignored
# by `jankurai audit`. The --policy FLAG is also ignored; only this
# auto-discovered file is read, and only its [scan]/minimum_score/[history] keys
# take effect. So nothing below is "config" — it is a documented register of
# findings we reviewed and accept as tool false-positives; the score is honestly
# tool-capped until jankurai gains a real allowlist.
#
# HLT-001 dead-language hits that are LOAD-BEARING API / protocol names (renaming
# breaks GitHub parity, the React/HTML platform contract, or the wire protocol):
#   stale       -> GitHub CheckConclusion REST value "stale" (jeryu-api/github.rs
#                  wire mapping; the Rust variant is renamed `Superseded`, but the
#                  wire STRING must stay); SPA-facing backend error codes
#                  (merge_sha_stale / merge_passport_stale / settings_hash_stale);
#                  the GitHub `dismiss_stale_approvals` branch-protection field.
#   placeholder -> the HTML `<input placeholder>` attribute / React prop name.
#   fallback    -> the React `<Suspense fallback>` / ErrorBoundary prop name.
#   old / new   -> unified-diff side labels + git ref-update `<old-oid> <new-oid>`.
#
# Same-sink multi-rule false-positives (HLT-031 / HLT-039 / HLT-023 all fire on
# one line): web/src/components/browser/MarkdownRenderer.tsx dangerouslySetInnerHTML
# of `safeHtml`, which is ALWAYS DOMPurify.sanitize(...) over server-side ammonia
# sanitization — the only way to render sanitized Markdown in React, with an
# existing XSS negative test (MarkdownRenderer.test.tsx, W-FE-09). And
# web/src/stores/realtimeStore.ts sessionStorage of a non-secret WS resume cursor
# (monotonic event sequence), not a credential.
#
# To raise the score HONESTLY, jankurai needs a per-term / per-rule-per-path
# allowlist — a jankurai change, not a code-quality fix in this repo.
