[[lane]]
name = "check"
command = "just check"
purpose = "manifest, shell, hosted-source, and security hostile checks"
requires_network = false

[[lane]]
name = "score"
command = "just score"
purpose = "pinned Jankurai repository score and hard-finding gate"
requires_network = false

[[lane]]
name = "security"
command = "just security"
purpose = "required secret, workflow, tool-custody, advisory, and SBOM checks"
requires_network = false

[[lane]]
name = "artifact-support"
