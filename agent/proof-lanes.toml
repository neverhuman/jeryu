[lanes.cache-key]
required = ["cargo test -p jeryu-cache-core cache_key"]
blocks_merge = true

[lanes.cache-law]
required = ["cargo test -p jeryu-cache-core policy"]
blocks_merge = true

[lanes.cache-service]
required = ["cargo test -p jeryu-cache-core -p jeryu-cache-service"]
blocks_merge = true

[lanes.adversarial-cache]
required = ["cargo test -p jeryu-cache-adversary"]
blocks_merge = true

[lanes.tooling]
required = ["cargo test -p jeryu-cache-cli", "cargo run -p jeryu-cache-cli -- self-test"]
blocks_merge = true

[lanes.policy-config]
required = ["./scripts/ci-doctor.sh"]
blocks_merge = true

[lanes.agent]
required = ["./scripts/check-agent-maps.sh"]
blocks_merge = true

[lanes.agent-substrate]
required = [
  "cargo test -p jeryu-agent-auth --jobs 40",
  "cargo test -p jeryu-agent-stream --jobs 40",
  "cargo test -p jeryu-cli --jobs 40",
  "cargo test -p jeryu-mcp --jobs 40",
  "cargo test -p jeryu-api --features web --jobs 40",
  "cargo test -p jeryu-agentbridge -p jeryu-egress --jobs 40",
  "cargo test -p jeryu-sandbox-linux --jobs 40",
  "cargo test -p jeryu-runnerd workcell --jobs 40",
  "bash ops/ci/workflow-lint.sh",
  "just security",
  "cargo test -p jeryu-agentbridge --test adversarial_refute -- --nocapture"
]
blocks_merge = true

[lanes.jankurai-proof]
required = [
  "./scripts/check-owner-test-map.sh",
  "./scripts/check-agent-maps.sh",
  "cargo run -q -p jeryu-mapcheck -- generated-zones",
  "cargo run -q -p jeryu-mapcheck -- db-boundary",
  "./ops/ci/jankurai.sh"
]
blocks_merge = true

[lanes.local-ci-parity]
required = [
  "cargo test -p jeryu-repogate --jobs 40",
  "cargo run -q -p jeryu-repogate -- ci-lanes-check",
  "bash scripts/ci-phases.sh"
]
blocks_merge = true

[lanes.workspace]
required = ["cargo test --workspace --jobs 40"]
blocks_merge = true

[lanes.api]
required = ["cargo test -p jeryu-api --features web --jobs 40"]
blocks_merge = true

[lanes.codegraph-oracle]
required = ["bash ops/ci/codegraph-oracle.sh"]
blocks_merge = true
