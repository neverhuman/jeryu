[extend]
useDefault = true

[allowlist]
description = "Ignore generated audit receipts, build artifacts, and documented public sentinels"
paths = [
  '''(^|/)target/''',
  '''(^|/)\.jankurai/''',
  '''(^|/)agent/repo-score\.json$''',
  '''(^|/)agent/repo-score\.md$''',
  '''(^|/)agent/score-history\.csv$''',
  '''(^|/)agent/score-history\.jsonl$''',
  '''(^|/)agent-map\.json$''',
  '''(^|/)test-map\.json$''',
  '''(^|/)src/honeypot\.rs$''',
  '''(^|/)tips/''',
  '''(^|/)docs/''',
  '''(^|/)paper/''',
  '''(^|/)CHANGELOG\.md$''',
  '''(^|/)README\.md$''',
  '''(^|/)apps/web/dist/''',
  '''(^|/)apps/web/storybook-static/''',
  '''(^|/)apps/web/playwright-report/''',
  '''(^|/)apps/web/test-results/''',
  '''(^|/)apps/web/coverage/''',
  '''(^|/)apps/web/\.lighthouseci/''',
  '''(^|/)node_modules/''',
  '''(^|/)contracts/generated/''',
  '''(^|/)schemas/web-api\.openapi\.json$''',
  '''(^|/)schemas/websocket-events\.schema\.json$''',
]
