[workspace.package]
version = "5.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/neverhuman/jeryu"
authors = ["Jeryu"]
rust-version = "1.95"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.103"
