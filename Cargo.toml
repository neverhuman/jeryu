[workspace]
resolver = "2"
members = [
  "crates/jeryu-mapcheck",
  "crates/jeryu-tui",
  "crates/jeryu-review",
  "crates/jeryu-autonomy",
  "crates/jeryu-mcp",
  "crates/jeryu-readmodel",
  "crates/jeryu-bugtracker",
  "bins/jeryu-ci-bin",
  "bins/jeryu-phase11-bin",
  "crates/jeryu-agentbridge",
  "crates/jeryu-artifact-metadata",
  "crates/jeryu-bench",
  "crates/jeryu-cache-policy",
  "crates/jeryu-ci-compiler",
  "crates/jeryu-ci-ir",
  "crates/jeryu-ci-scheduler",
  "crates/jeryu-compliance-export",
  "crates/jeryu-cache",
  "crates/jeryu-cache-adversary",
  "crates/jeryu-cache-cli",
  "crates/jeryu-cache-core",
  "crates/jeryu-cache-service",
  "crates/jeryu-cli",
  "crates/jeryu-core",
  "crates/domain",
  "crates/jeryu-gitd",
  "crates/jeryu-api",
  "crates/jeryu-enterprise",
  "crates/jeryu-evidence",
  "crates/jeryu-obs",
  "crates/jeryu-lifecycle",
  "crates/jeryu-mirror",
  "crates/jeryu-mirror-cli",
  "crates/jeryu-kernel",
  "crates/jeryu-ops",
  "crates/jeryu-phase11-audit",
  "crates/jeryu-phase11-core",
  "crates/jeryu-phase7-cli",
  "crates/jeryu-proof",
  "crates/jeryu-replay-verifier",
  "crates/jeryu-runner-core",
  "crates/jeryu-runner-microvm",
  "crates/jeryu-runner-native",
  "crates/jeryu-sandbox-linux",
  "crates/jeryu-runner-oci",
  "crates/jeryu-runner-protocol",
  "crates/jeryu-runnerd",
  "crates/jeryu-rustjet",
  "crates/jeryu-rustjet-cli",
  "crates/jeryu-signing",
  "crates/jeryu-signrail",
  "crates/jeryu-tenant",
  "crates/jeryu-repogate",
]
exclude = [
  "fixtures/rust-small",
]

[workspace.package]
version = "4.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/neverhuman/jeryu"
authors = ["Jeryu"]
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
parking_lot = "0.12"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
