[workspace]
members = [
    ".",
    "crates/cargo-witness",
    "crates/witness-rt",
    "crates/cargo-vrc",
    "crates/cargo-aer",
    "crates/arc-bench",
    "crates/tui-capture",
    "crates/domain",
    "crates/adapters/cache-brain",
    "crates/jeryu-gcd",
]
resolver = "2"

[workspace.package]
version = "3.3.23"
edition = "2024"
license = "MIT"
authors = []
rust-version = "1.95"

# Shared deps used by the proof-scoped control plane crates.
# jeryu uses its own explicit declarations below.
[workspace.dependencies]
anyhow = "1"
cargo_metadata = "0"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
globset = "0"
libc = "0"
quote = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0"
sha2 = "0.11.0"
syn = { version = "2", features = ["full", "parsing", "visit"] }
tokio = { version = "1", features = ["full"] }
toml = "0"
walkdir = "2"

[workspace.metadata.agent]
validation_order = [
    "cargo check --workspace",
    "cargo nextest run -E 'package(<arc>)'",
    "cargo run -p cargo-witness -- build",
    "cargo run -p cargo-vrc -- map --output-dir .",
    "cargo run -p cargo-aer -- scan --output aer-findings.json",
]
ci_profiles = [
    { name = "inner-loop", commands = ["cargo check --workspace", "cargo nextest run -p jeryu --lib"] },
    { name = "pull-request", commands = ["cargo check --workspace", "cargo nextest run -p jeryu --lib", "cargo run -p cargo-witness -- build", "cargo run -p cargo-vrc -- map --output-dir .", "cargo run -p cargo-aer -- scan --output aer-findings.json"] },
    { name = "runtime-sqlite-kafka", commands = ["just runtime-sqlite-kafka"] },
    { name = "runtime-redlinedb-jansu", commands = ["just runtime-redlinedb-jansu"] },
    { name = "release-blocking", commands = ["cargo nextest run -p jeryu", "cargo deny check", "cargo run -p arc-bench -- run psd-mechanics"] },
    { name = "scheduled-hardening", commands = ["cargo semver-checks check-release", "cargo run -p cargo-aer -- scan --output aer-findings.json"] },
]

# -------------------------------------------------------------------
# jeryu package
# -------------------------------------------------------------------

[package]
name = "jeryu"
version.workspace = true
edition.workspace = true
license.workspace = true
# Multiple binaries (jeryu + autonomy) means `cargo run -p jeryu` is ambiguous.
# Pick jeryu as the default so CI commands and `cargo run --` keep working.
default-run = "jeryu"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Web framework (webhook receiver + admin API + Web Forge BFF)
axum = { version = "0.8", features = ["json", "ws", "macros", "multipart"] }
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip", "compression-br", "set-header", "request-id", "timeout"] }

# Web Forge BFF support crates (see WEB_WORK_CLAUDE.md §3.1 / FINAL spec §6.1)
tokio-stream = { version = "0.1", features = ["sync"] }
headers = "0.4"
bytes = "1"
mime_guess = "2"
async-stream = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
comrak = { version = "0.37", default-features = false, optional = true }
utoipa = { version = "5", features = ["chrono", "uuid", "axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
ts-rs = { version = "10", features = ["chrono-impl", "uuid-impl"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }
indexmap = { version = "2", features = ["serde"] }
serde_with = "3"
parking_lot = "0.12"

# HTTP client (for GitLab API calls the gitlab crate doesn't cover)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Docker control
bollard = "0.18"

# SQLite is the default embedded state backend. RedlineDB remains available
# behind the explicit `redlinedb-backend` feature for compatibility lanes.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "any", "macros"] }
redlinedb-sqlx = { git = "https://github.com/neverhuman/RedlineDB.git", rev = "828667b49fd3adee88c8bdd48681b38c57b95563", optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0"
toml = "0.8"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.9"
base64 = "0.22"
dotenvy = "0.15"
dirs = "6"
futures-util = "0.3"
git2 = "0.20.4"
ratatui = "0.30.0"
crossterm = "0.29.0"
tokio-util = "0.7.18"
notify = "8.2.0"
urlencoding = "2.1.3"
ansi-to-tui = "8.0.1"
font8x8 = "0.3"
gif = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.11.0"
hex = "0.4.3"
regex = "1"
ed25519-dalek = "2"
httparse = "1.10.1"
dashmap = "6.1.0"
cargo_metadata = "0.23.1"
tempfile = "3.27.0"
libc = "0.2"
walkdir = "2"
witness-rt = { path = "crates/witness-rt" }
cache-brain-adapter = { path = "crates/adapters/cache-brain" }
async-trait = "0.1"

# Jansu — in-process embedded broker, used for webhook event
# dispatch. URL-pinned to the v0.6.1 feature branch tip including the J-4
# Consumer batch-tail redelivery fix (jansu PR #11 commit 9f61c0d). Switch
# to `tag = "v0.6.1"` once neverhuman/jansu cuts the release tag.
# Default-on webhook broker dependencies. Builds without default features compile
# only as diagnostics; webhook handling rejects events without this feature.
jansu-embedded = { git = "https://github.com/neverhuman/jansu.git", rev = "9f61c0d", default-features = false, optional = true }
jansu-sans-io = { git = "https://github.com/neverhuman/jansu.git", rev = "9f61c0d", default-features = false, optional = true }
# `url` is shared by jansu-backend and the Web Forge BFF — keep it non-optional.
url = "2"

# Bin definitions. `src/bin/*.rs` is auto-discovered, but `jeryu_export_types`
# requires the `web` feature (ts-rs derives only exist under `--features web`),
# so we declare an explicit `[[bin]]` block to gate compilation. The other
# auto-discovered bins (`autonomy.rs`, `jeryu` from `src/main.rs`) keep working
# unchanged.
[[bin]]
name = "jeryu_export_types"
path = "src/bin/jeryu_export_types.rs"
required-features = ["web"]

[features]
default = ["profile-sqlite-kafka", "demo-fixtures"]
# Opt-in feature gating the JeRyu Web Forge BFF and frontend integration glue.
# Off by default so non-web builds skip the additional surface; enable with
# `cargo check --features web` (or `cargo build --features web`).
web = []
sqlite-backend = ["sqlx/sqlite"]
redlinedb-backend = ["dep:redlinedb-sqlx"]
kafka-backend = []
jansu-backend = ["dep:jansu-embedded", "dep:jansu-sans-io"]
profile-sqlite-kafka = ["sqlite-backend", "kafka-backend"]
profile-redlinedb-jansu = ["redlinedb-backend", "jansu-broker"]
# In-memory demo fixtures (5-PR walkthrough used by `jeryu tui --demo`).
# Default-on so the demo flag keeps working. Release builds that don't
# need the demo path opt out with `--no-default-features`.
demo-fixtures = []
# Route webhook events through an embedded Jansu broker (producer in the HTTP
# handler, consumer in the autonomy daemon). Adds the jansu-embedded transitive
# closure (~object_store, rama).
jansu-broker = ["jansu-backend"]

[dev-dependencies]
# Tuiwright is NOT managed as a library in this repo. It MUST be pulled from
# the jankurai workspace at an explicit version tag — never a local path.
# Bump the `tag` to upgrade; Cargo.lock pins the exact commit.
jsonschema = "0.45.1"
tuiwright = { git = "https://github.com/neverhuman/jankurai.git", tag = "v1.5.1" }
# axum + tokio are re-listed as dev-deps so integration test binaries under
# tests/ can import them directly (integration tests compile as separate
# binaries and do not automatically inherit the crate's [dependencies]).
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
# `tower` (specifically `ServiceExt::oneshot`) is needed by the W-F-13
# `tests/engine_routes_preserved_test.rs` regression guard that exercises the
# engine router without binding a real TCP socket.
tower = { version = "0.5", features = ["util"] }

[package.metadata.agent]
purpose = "Single-binary CI/CD control plane for GitLab-based pipelines"
risk = "high"
owned_paths = [
    "src/**",
    "tests/**",
    "docs/**",
    "paper/**",
    "Cargo.toml",
    "Cargo.lock",
    "AGENTS.md",
    "proof-lanes.toml",
]
invariants = [
    "Errors use anyhow throughout",
    "State changes go through state::Db methods — never raw SQL in callers",
    "Security modules require security-relevant proof lane (see proof-lanes.toml)",
    "main.rs is CLI dispatcher only — no business logic",
]
local_validate = [
    "cargo check -p jeryu --message-format=json",
    "cargo nextest run -p jeryu --lib",
]
exceptions = [
    "mega-file.jeryu",
    "mega-function.jeryu",
]
ci_profiles = [
    { name = "inner-loop",       commands = ["cargo check -p jeryu --message-format=json", "cargo nextest run -p jeryu --lib", "cargo nextest run --test mock_lifecycle_tests"] },
    { name = "pull-request",     commands = ["cargo check -p jeryu --message-format=json", "cargo nextest run -p jeryu --lib", "cargo nextest run --test mock_lifecycle_tests", "cargo test -p jeryu --test '*' -- --test-threads=1"] },
    { name = "runtime-sqlite-kafka", commands = ["just runtime-sqlite-kafka"] },
    { name = "runtime-redlinedb-jansu", commands = ["just runtime-redlinedb-jansu"] },
    { name = "release-blocking", commands = ["cargo nextest run -p jeryu", "cargo deny check"] },
]

