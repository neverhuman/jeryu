[workspace]
resolver = "2"
members = [
  "bins/jit-ci",
  "bins/jit-phase11",
  "crates/agentbridge",
  "crates/artifact-metadata",
  "crates/benchlab",
  "crates/cache-policy",
  "crates/ci-compiler",
  "crates/ci-ir",
  "crates/ci-scheduler",
  "crates/compliance-export",
  "crates/cratevault",
  "crates/cratevault-adversary",
  "crates/cratevault-cli",
  "crates/cratevault-core",
  "crates/cratevault-service",
  "crates/forge-core",
  "crates/gitd",
  "crates/jitforge-api",
  "crates/jitforge-enterprise",
  "crates/jitforge-obs",
  "crates/lifecycle-manager",
  "crates/mirrorvault",
  "crates/mirrorvault-cli",
  "crates/nitro-kernel",
  "crates/ops-automation",
  "crates/phase11-audit",
  "crates/phase11-core",
  "crates/phase7-cli",
  "crates/proofcore",
  "crates/replay-verifier",
  "crates/runner-core",
  "crates/runner-microvm",
  "crates/runner-native",
  "crates/runner-oci",
  "crates/runner-protocol",
  "crates/runnerd",
  "crates/rustjet",
  "crates/rustjet-cli",
  "crates/signrail",
  "crates/tenant-guard",
]
exclude = [
  "fixtures/rust-small",
]

[workspace.package]
version = "0.12.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://example.invalid/jitforge-nitro"
authors = ["JitForge Nitro"]
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "allow", priority = -1 }
