schema_version = "1"
protect_main = true
protected_branches = ["{{DEFAULT_BRANCH}}"]
protected_tags = ["v*"]
hooks = "advisory"

[main_relay]
enabled = true
actor = "jeryu"
protected_branch = "{{DEFAULT_BRANCH}}"
require_admission_receipt = true

[offline_release_mirror]
enabled = {{OFFLINE_MIRROR_ENABLED}}
remote = "{{EXTERNAL_REMOTE}}"
refs = ["refs/tags/v*", "refs/heads/release/*"]
