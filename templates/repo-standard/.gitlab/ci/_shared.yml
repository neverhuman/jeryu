---
# Shared CI primitives for jeryu-templated repos.
# Owned by jeryu's template tree; regenerated by `jeryu repo standard apply`.
# Source-of-truth: templates/repo-standard/.gitlab/ci/_shared.yml @ {{TEMPLATE_HASH}}

.shared_before_script:
  before_script:
    - |
      set -eu
      if [ "$(id -u)" = "0" ]; then
        # ── flock'd git clone ────────────────────────────────────────────────
        # Cold runner slots queue on a shared /cache lock so 30+ parallel jobs
        # do not stampede the GitLab clone endpoint with HTTP 502s. Warm slot:
        # cheap fetch in place; remote URL re-set per-job because
        # CI_REPOSITORY_URL embeds a one-shot JOB-TOKEN.
        _gd="${GIT_DEPTH:-50}"
        mkdir -p /cache
        if [ -d "${CI_PROJECT_DIR}/.git" ] \
           && git -C "${CI_PROJECT_DIR}" remote get-url origin >/dev/null 2>&1; then
          git -C "${CI_PROJECT_DIR}" remote set-url origin "${CI_REPOSITORY_URL}"
          git -C "${CI_PROJECT_DIR}" fetch --depth="${_gd}" --retry 3 origin \
            "+${CI_COMMIT_REF_NAME}:refs/remotes/origin/${CI_COMMIT_REF_NAME}" \
            2>/dev/null || \
          git -C "${CI_PROJECT_DIR}" fetch --depth="${_gd}" --retry 3 origin 2>/dev/null \
            || true
        else
          _parent="$(dirname "${CI_PROJECT_DIR}")"
          mkdir -p "${_parent}"
          cd "${_parent}"
          rm -rf "${CI_PROJECT_DIR}"
          flock -x -w 600 /cache/git-clone.lock \
            git clone --depth="${_gd}" --branch "${CI_COMMIT_REF_NAME}" \
              "${CI_REPOSITORY_URL}" "${CI_PROJECT_DIR}"
          cd "${CI_PROJECT_DIR}"
          unset _parent
        fi
        git -C "${CI_PROJECT_DIR}" checkout -f "${CI_COMMIT_SHA}"
        unset _gd

        # ── defensive sccache eviction ───────────────────────────────────────
        # The ci-base image strips sccache at build time, but if a stray
        # pre_build_script sets RUSTC_WRAPPER=sccache we kill the wrapper
        # here. Cheap, idempotent — prevents the 0%-CPU zombie hang seen
        # across multiple repos before the baked image existed.
        export RUSTC_WRAPPER=""
        export JERYU_SCCACHE_ENABLED="0"
        if command -v sccache >/dev/null 2>&1; then
          sccache --stop-server >/dev/null 2>&1 || true
        fi
      fi
      # Symlink ./target → $CARGO_TARGET_DIR if the runner exports a cache
      # dir, so scripts that hardcode ./target keep working.
      if [ -n "${CARGO_TARGET_DIR:-}" ] && [ ! -e target ]; then
        ln -sfn "$CARGO_TARGET_DIR" target
      fi

# Optional: jobs that need extra apt packages call:
#   before_script:
#     - !reference [.shared_before_script, before_script]
#     - !reference [.shared_apt_install, before_script]
# with $APT_EXTRA_PACKAGES set to a space-separated list.
.shared_apt_install:
  before_script:
    - |
      set -eu
      if [ "$(id -u)" = "0" ] && [ -n "${APT_EXTRA_PACKAGES:-}" ]; then
        _apt_cache="/dev/shm/apt-dl-$$"
        mkdir -p "$_apt_cache"
        _apt_opts="-o Acquire::Retries=3 -o Dir::Cache::archives=$_apt_cache"
        apt-get $_apt_opts update -q
        _apt_ok=0
        for _apt_n in 1 2 3 4 5; do
          if DEBIAN_FRONTEND=noninteractive \
             apt-get $_apt_opts install -y -q --no-install-recommends \
               $APT_EXTRA_PACKAGES; then
            _apt_ok=1
            break
          fi
          echo "apt-get install attempt ${_apt_n}/5 failed; sleeping 10s" >&2
          sleep 10
        done
        rm -rf "$_apt_cache"
        if [ "${_apt_ok}" != "1" ]; then
          echo "FATAL: apt-get exhausted retries" >&2
          exit 1
        fi
        unset _apt_opts _apt_ok _apt_n _apt_cache
      fi
