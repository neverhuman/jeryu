---
# Generated by `jeryu repo standard apply`. Do not edit by hand.
# Drift is detected by `jeryu repo standard verify` against .jeryu/standard.lock.
#
# Image: pre-baked rust:1.95.0 + nextest + jankurai + node + python + sqlite.
#        No sccache (the image bakes it out per docker/ci-base/Dockerfile).
# Runner: untagged-only. Standard runners run with `run_untagged=true` and
#         empty `tag_list` per src/runner_policy.rs:14-29.
# Tags  : NONE. scripts/ci/no-runner-tags.sh enforces this — copied to
#         .jeryu/ci/no-runner-tags.sh by `apply` so the gate works even when
#         jeryu itself is not installed inside the CI container.
# Mirror: post-merge external push (Phase H) is enqueued automatically by the
#         jeryu binary on the master node; no CI step needed.

include:
  - local: .gitlab/ci/_shared.yml

stages:
  - quality
  - build
  - test
  - evidence
  - release

variables:
  CARGO_TERM_COLOR: "always"
  CARGO_INCREMENTAL: "0"
  GIT_DEPTH: "50"
  GIT_STRATEGY: "none"           # _shared.yml does flock'd clone
  JERYU_CARGO_CACHE: "0"
  JERYU_SCCACHE_ENABLED: "0"
  RUSTC_WRAPPER: ""
  JANKURAI_RELEASE_ROOT: "target/jankurai/releases"
  JANKURAI_INSTALL_MODE: "staged"

default:
  image: "${CI_REGISTRY}/root/jeryu/ci-base:1.95.0"
  interruptible: true
  timeout: 30m
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
  before_script:
    - !reference [.shared_before_script, before_script]

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "{{DEFAULT_BRANCH}}"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ── stage: quality ────────────────────────────────────────────────────────

ci_runner_policy:
  stage: quality
  script:
    - bash .jeryu/ci/no-runner-tags.sh .

rust_fmt:
  stage: quality
  script:
    - cargo fmt --all -- --check

rust_clippy:
  stage: quality
  script:
    - cargo clippy --workspace --all-targets --locked -- -D warnings

# ── stage: build ──────────────────────────────────────────────────────────

rust_build:
  stage: build
  script:
    - cargo build --workspace --locked

# ── stage: test ───────────────────────────────────────────────────────────

rust_test:
  stage: test
  script:
    - cargo nextest run --workspace --locked --no-fail-fast

# ── stage: evidence ───────────────────────────────────────────────────────

jankurai_audit:
  stage: evidence
  variables:
    JANKURAI_INSTALL_MODE: "staged"
  script:
    - bash .jeryu/ci/install-jankurai.sh
    - jankurai audit . --mode strict --json target/jankurai/audit.json --md target/jankurai/audit.md
  artifacts:
    when: always
    paths:
      - target/jankurai/
    expire_in: 1 week

# ── stage: release ────────────────────────────────────────────────────────

release_preflight:
  stage: release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
  script:
    - echo "release preflight for $CI_COMMIT_TAG"
    - cargo build --release --workspace --locked
